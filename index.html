.plist .ttl{font-size:clamp(1.6rem,2.7vw,2.6rem);font-weight:400;letter-spacing:0;line-height:1.1;text-transform:uppercase}
.plist li.is-active .ttl{font-weight:500}
.plist .slot{justify-self:start;margin-left:20px;width:54px;height:54px}
.plist li.is-active a,.plist a:hover{color:var(--ink)}
.preview{position:relative;height:100%;perspective:1500px;perspective-origin:0 50%}
.preview-frame.off{transform:rotateY(-17deg) scaleX(.03);opacity:0;transition:transform .22s ease-in,opacity .22s ease-in}
.preview-frame{position:absolute;left:0;top:0;width:min(100%,620px);aspect-ratio:16/10;background:var(--bg2);overflow:hidden;border-radius:14px;transform-origin:0 50%;transform:rotateY(-17deg);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease;box-shadow:0 0 0 1px rgba(255,255,255,.75),0 0 46px rgba(73,181,255,.30),0 50px 90px -40px rgba(20,40,80,.40)}
body.on-work .preview-frame{cursor:pointer}
.preview-frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 0 40px rgba(73,181,255,.12)}
.cnr{position:absolute;left:0;width:1px;height:1px;pointer-events:none}.cnr.tl{top:0}.cnr.bl{bottom:0}
.work .pv-cap{display:none}
.pv{position:absolute;inset:0;opacity:0;transform:scale(1.03);transition:opacity .5s ease,transform .8s var(--ease)}
.pv.on{opacity:1;transform:scale(1)}
.pv>*{width:100%;height:100%}
.pv img,.pv video{object-fit:cover;display:block}
.pv-cap{display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:var(--muted);font-size:.92rem;min-height:1.5em}
.pv-cap b{color:var(--ink);font-weight:500}
.empty{color:var(--muted)}
/* media */
.ph{position:relative;width:100%;height:100%;background:radial-gradient(70% 80% at 70% 30%,var(--b) 0%,transparent 70%),linear-gradient(160deg,var(--a),color-mix(in srgb,var(--a) 70%,#fff));overflow:hidden}
.ph b{position:absolute;left:6%;bottom:4%;font-size:clamp(3rem,11cqi,9rem);font-weight:600;letter-spacing:-.05em;color:rgba(17,17,17,.10);line-height:1;white-space:nowrap}
.ph span{position:absolute;left:16px;top:14px;font-size:.78rem;color:rgba(17,17,17,.45);font-weight:500}
.media{container-type:inline-size}
/* case */
.case{padding-top:128px;padding-bottom:160px;position:relative}
@media (min-width:901px){.case.container{padding-right:calc(clamp(20px,4vw,56px) + 104px)}}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:40px}
.back:hover{color:var(--ink)}
.case-head{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
.case-head h1{font-size:clamp(3rem,8.5vw,8.5rem);font-weight:600;letter-spacing:-.05em;line-height:.9;margin:0;overflow-wrap:anywhere}
.case-desc{margin:0;font-size:clamp(1.05rem,1.4vw,1.25rem);max-width:46ch;white-space:pre-line}
.case-meta{display:flex;flex-wrap:wrap;gap:12px 40px;margin:24px 0 0;padding:0}
.case-meta div{display:grid;gap:2px}
.case-meta dt{color:var(--muted);font-size:.85rem}
.case-meta dd{margin:0;font-weight:500}
.car{margin-top:88px}
.car-count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.92rem;min-width:56px;text-align:right}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;transition:border-color .2s}
.rbtn:hover:not(:disabled){border-color:var(--ink)}
.rbtn:disabled{opacity:.35;cursor:default}
.rbtn svg{width:16px;height:16px}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px;outline:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 auto;height:clamp(280px,62vh,640px);max-width:88vw;scroll-snap-align:center;background:var(--bg2);border-radius:4px;overflow:hidden;margin:0}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.case-next{margin-top:120px;border-top:1px solid var(--line);padding-top:28px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.case-next span{color:var(--muted)}
.case-next a{font-size:clamp(2rem,5vw,4.5rem);font-weight:600;letter-spacing:-.04em;text-decoration:none;line-height:1}
/* about / contact */
.about,.contact{padding-top:128px;padding-bottom:120px;min-height:100svh}
.statement{font-size:clamp(2rem,4.6vw,4.4rem);font-weight:600;letter-spacing:-.035em;line-height:1.04;margin:0;max-width:20ch}
.pet-spot{width:clamp(110px,13vw,170px);aspect-ratio:1}
.big{font-size:clamp(3rem,9vw,9rem);font-weight:600;letter-spacing:-.05em;line-height:.9;margin:0}
.lead{margin:40px 0 0;color:var(--muted);font-size:1.2rem;max-width:40ch}
.email{display:inline-block;margin-top:40px;font-size:clamp(1.5rem,3.4vw,3rem);font-weight:500;letter-spacing:-.03em;text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:4px;overflow-wrap:anywhere}
.clinks{list-style:none;padding:0;margin:56px 0 0;display:flex;flex-wrap:wrap;gap:12px 36px}
.clinks a{text-decoration:none;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:2px}
.clinks a:hover{border-color:var(--ink)}
/* pet */
#pet{position:fixed;left:0;top:0;width:200px;height:200px;z-index:30;pointer-events:none;transform-origin:100px 100px;opacity:0;transition:opacity .4s}
#pet .hopw,#pet .bob{position:absolute;inset:0}
#pet .bob{animation:bob 3.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.4deg)}}
#pet.sphere .bob{animation-duration:2.6s}
#pet.img:not(.sphere) .bob{animation:breathe 4.4s ease-in-out infinite;transform-origin:100px 190px}
@keyframes breathe{50%{transform:scale(1.008,1.014)}}
#pet .hopw.hop{animation:hop .42s cubic-bezier(.3,0,.3,1)}
#pet .hopw.hop .shadow{animation:hopsh .42s cubic-bezier(.3,0,.3,1)}
@keyframes hopsh{35%{transform:translateY(16px) scale(.72);opacity:.55}70%{transform:translateY(-2px)}}
@keyframes hop{35%{transform:translateY(-16px)}70%{transform:translateY(2px) scale(1.04,.96)}}
#pet .body{position:absolute;left:30px;top:30px;width:140px;height:124px;border-radius:50% 50% 47% 47%/54% 54% 46% 46%;background:radial-gradient(120% 100% at 30% 16%,#fff 0%,#f4f2ef 42%,#d8d4ce 100%);box-shadow:inset -6px -10px 18px rgba(20,30,50,.08),inset 4px 6px 10px rgba(255,255,255,.9),0 16px 30px -12px rgba(17,17,17,.28);transition:all .45s var(--ease)}
#pet .body::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:30%;border-radius:50%;border-top:1px solid rgba(20,30,50,.12);opacity:0;transition:opacity .45s}
#pet .body.squeeze{transform:scale(1.08,.88)}
#pet .face{position:absolute;left:15px;top:15px;width:110px;height:81px;border-radius:48% 48% 44% 44%/52% 52% 48% 48%;background:linear-gradient(165deg,#2c3037 0%,#0b0c0f 55%,#050506 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -4px 10px rgba(0,0,0,.6);overflow:hidden;transition:all .45s var(--ease)}
#pet .face::after{content:"";position:absolute;left:10%;top:5%;width:55%;height:32%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
#pet .eyes{position:absolute;left:50%;top:50%;transition:opacity .18s;scale:var(--sx,1) 1}
#pet .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center;color:#dff3ff;font:600 12px/1.05 "Instrument Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;text-shadow:0 0 3px #49B5FF,0 0 9px rgba(73,181,255,.65);opacity:0;clip-path:inset(0 100% 0 0);transition:opacity .2s,clip-path .5s steps(12,end)}
#pet .scr.glyph{clip-path:none;transition:opacity .22s}
#pet .scr svg{width:32px;height:32px;fill:none;stroke:#dff3ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #49B5FF) drop-shadow(0 0 5px rgba(73,181,255,.7))}
#pet .face::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);opacity:0;transition:opacity .3s;pointer-events:none}
#pet .face.on::before{opacity:0}
#pet .face.on .scr{opacity:1;clip-path:inset(0 0 0 0)}
#pet .face.on .eyes,#pet.hello .eyes{opacity:0}
#pet.sphere .scr{display:none}
#pet .eye::after{content:"";position:absolute;left:-16px;right:-16px;top:-19px;height:0;background:linear-gradient(180deg,rgba(8,9,12,0) 0%,#08090c 45%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);transition:height .6s var(--ease),transform .6s var(--ease)}
#pet.bored .eye::after{height:29px}
#pet.bored .eye:first-child::after{transform:rotate(-8deg)}#pet.bored .eye:last-child::after{transform:rotate(8deg)}
#pet.bored .eyes{transition:opacity .18s}
#pet.yawn .eye{transform:scaleY(.2);opacity:0}
#pet .mouth{position:absolute;left:49px;top:60px;width:12px;height:3px;border:3px solid #cdeeff;border-radius:50%;box-shadow:0 0 2px #2f8fff,0 0 7px #2f8fff,inset 0 0 5px rgba(47,143,255,.8);opacity:0;transition:all .5s var(--ease)}
#pet.yawn .mouth{opacity:1;left:45px;top:53px;width:20px;height:20px}
#pet .tear{position:absolute;left:89px;top:50px;width:6px;height:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#cdeeff;box-shadow:0 0 4px #2f8fff,0 0 8px rgba(47,143,255,.7);opacity:0}
#pet.yawn .tear{animation:tear 1.5s .5s ease-in forwards}
@keyframes tear{0%{opacity:0;transform:translateY(-2px) scale(.4)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(17px) scale(.8)}}
#pet.yawn .hopw{transform:translateY(2px) scale(1.01,.98);transition:transform .6s var(--ease)}
#pet .hopw{transition:transform .5s var(--ease)}
#pet .scr.big{transition:opacity .25s,clip-path .9s steps(18,end);font-size:20px;letter-spacing:-.02em;white-space:nowrap;font-family:"Instrument Sans","Manrope","Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Apple SD Gothic Neo","PingFang SC","Microsoft YaHei","Malgun Gothic","Noto Sans CJK SC","Geeza Pro","Segoe UI","Noto Sans Arabic",sans-serif}
#pet .scr.rtl{direction:rtl;clip-path:inset(0 0 0 100%)}
#pet .face.on .scr.rtl{clip-path:inset(0 0 0 0)}
#pet.sphere .mouth,#pet.sphere .tear{display:none}
#pet .batt{position:absolute;left:36px;top:30px;width:32px;height:20px;box-sizing:border-box;border:3px solid #cdeeff;border-radius:5px;box-shadow:0 0 3px #2f8fff,0 0 8px rgba(47,143,255,.7);opacity:0;transform:scale(.8);transition:opacity .35s .15s,transform .35s .15s var(--ease)}
#pet .batt::after{content:"";position:absolute;right:-7px;top:4px;width:3px;height:6px;border-radius:0 2px 2px 0;background:#cdeeff;box-shadow:0 0 4px #2f8fff}
#pet .batt i{position:absolute;left:2px;top:2px;bottom:2px;width:6px;border-radius:1.5px;background:#cdeeff;box-shadow:0 0 4px #2f8fff}
#pet.yawn .batt{opacity:1;transform:none}
#pet.yawn .batt i{animation:battLow .5s steps(2) infinite}
@keyframes battLow{50%{opacity:.15}}
#pet.sphere .batt{display:none}
#pet .rimgs{position:absolute;inset:0;transform-origin:100px 100px;transition:opacity .3s}
#pet .rimgs img{position:absolute;left:0;top:0;width:200px;height:200px;opacity:0}
#pet .rimgs img.on{opacity:1}
#pet.sphere .rimgs{opacity:0}
#pet.img:not(.sphere) .body{background:none;box-shadow:none}
#pet.img:not(.sphere) .body::after{opacity:0}
#pet.img:not(.sphere) .face{background:none;box-shadow:none;border-radius:50%/52%}
#pet.img:not(.sphere):not(.morph) .face{transition:none}
#pet.img .face::after{display:none}
#pet.img:not(.sphere) .paw{opacity:0}
#pet.img:not(.sphere) .shadow{top:181px;left:44px;width:112px}
#pet.refl:not(.sphere) .shadow{top:183px;left:40px;width:120px;height:14px;background:radial-gradient(closest-side,rgba(18,28,48,.42),rgba(18,28,48,.16) 55%,rgba(18,28,48,0))}
#pet.refl:not(.sphere){-webkit-box-reflect:below -22px linear-gradient(to bottom,transparent 46%,rgba(0,0,0,.26) 100%)}
@supports (background:-moz-element(#x)){#pet.refl:not(.sphere) .hopw::after{content:"";position:absolute;left:0;top:178px;width:200px;height:200px;background:-moz-element(#petbob) no-repeat;transform:scaleY(-1);opacity:.3;mask-image:linear-gradient(to bottom,#000,transparent 26%);pointer-events:none}}
#pet.boot{visibility:hidden}
#pet .rland{position:absolute;left:0;top:0;width:200px;height:200px;display:none;pointer-events:none}
#pet.landing .rland{display:block}
#pet.landing .rimgs{opacity:0;transition:none}
#pet.landing .eyes,#pet.landing .scr{opacity:0}
#pet.waking .eyes{transition:opacity .8s ease}
#pet .dz{position:absolute;left:50%;top:50%;opacity:0;transition:opacity .2s;scale:var(--sx,1) 1;pointer-events:none}
#pet.dizzy .dz{opacity:1}
#pet.dizzy .eyes{opacity:0}
@keyframes irisb{0%{opacity:1;transform:scale(.05) rotate(0deg)}36%{opacity:1;transform:scale(1) rotate(75deg)}60%{opacity:1;transform:scale(1) rotate(75deg)}100%{opacity:1;transform:scale(.05) rotate(150deg)}}
#pet .hopw{rotate:0deg;transform-origin:100px 190px;transition:rotate .4s cubic-bezier(.3,1.5,.5,1)}
#pet.leaning .hopw{rotate:var(--lean,0deg)}
#pet.angry .eye::after{height:30px}
#pet.angry .eye:first-child::after{transform:rotate(17deg)}#pet.angry .eye:last-child::after{transform:rotate(-17deg)}
#pet.angry .eye{transform:scale(.94)}
#pet.angry .bob{animation:angshake .32s ease-in-out infinite;transform-origin:100px 190px}
@keyframes angshake{25%{transform:translateX(-1px) rotate(-.8deg)}75%{transform:translateX(1px) rotate(.8deg)}}
#pet .scr.warn{clip-path:none!important;transition:opacity .15s;padding:0}
#pet .wm{display:flex;flex-direction:column;align-items:center;gap:0;font-family:Poppins,"Instrument Sans","Helvetica Neue",Arial,sans-serif;font-weight:800;line-height:.96;letter-spacing:-.01em;color:#eef8ff;text-shadow:0 0 3px #2f8fff,0 0 9px rgba(47,143,255,.7)}
#pet .wm span{display:inline-block;white-space:nowrap;opacity:0;animation:wmIn .5s cubic-bezier(.2,1.5,.35,1) forwards}
#pet .wm span:nth-child(2){font-weight:700}
@keyframes wmIn{0%{opacity:0;transform:translateY(5px) scale(.55);filter:blur(2px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none}}
#pet.angry .wm span:first-child{animation:wmIn .5s cubic-bezier(.2,1.5,.35,1) forwards,wmPulse 1.2s .8s ease-in-out infinite}
@keyframes wmPulse{50%{transform:scale(1.06)}}
#pet .dz svg{position:absolute;top:-17px;width:34px;height:34px;overflow:visible;filter:drop-shadow(0 0 2px #2f8fff) drop-shadow(0 0 6px rgba(47,143,255,.8));animation:dzspin .75s linear infinite}
#pet .dz svg:first-child{left:-37.5px}#pet .dz svg:last-child{left:12.5px;animation-duration:.9s}
#pet .dz path{fill:none;stroke:#d6f1ff;stroke-width:3;stroke-linecap:round}
@keyframes dzspin{to{transform:rotate(360deg)}}
#pet.dizzy .bob{animation:dzwob .55s ease-in-out infinite;transform-origin:100px 190px}
@keyframes dzwob{25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}
#pet.sphere .dz{display:none}
#pet .sphimg{position:absolute;left:40px;top:40px;width:120px;height:120px;opacity:0;pointer-events:none}
#pet .sphwrap{position:absolute;left:40px;top:40px;width:120px;height:120px;opacity:0;pointer-events:none}
#pet .sphwrap img{position:absolute;inset:0;width:100%;height:100%}
#pet.rsph.sphere:not(.xform) .sphwrap{opacity:1}
#pet.sphere.deploy .rland{display:block!important}
#pet.deploy .sphwrap{opacity:0!important}
#pet.rsph.sphere .body,#pet.rsph.sphere .paw,#pet.rsph.sphere .pod,#pet.rsph.sphere .antenna{opacity:0!important;transition:none!important}
#pet.img .body,#pet.img .paw{transition:none!important}
#pet.img .face{transition:none!important}
#pet.rsph .lens{display:none!important}
#pet.xform .rland{display:block!important}
#pet.xform .rimgs{opacity:0;transition:none}
#pet.xform .eyes,#pet.xform .scr{opacity:0;transition:none}
#pet.antic .rland{display:block}
#pet.antic .rimgs{opacity:0;transition:none}
@keyframes rfade{from{opacity:0}to{opacity:1}}
#pet.sphere .rland{display:none}
#pet.antic.blink .eye{transform:none}
#pet .eye{position:absolute;top:-9px;width:28px;height:28px;border-radius:50%;background:transparent;border:4.5px solid #cdeeff;box-shadow:0 0 2px #2f8fff,0 0 7px #2f8fff,0 0 15px rgba(47,143,255,.6),inset 0 0 2px #2f8fff,inset 0 0 7px rgba(47,143,255,.8);transition:transform .14s,opacity .3s,border-color .2s}
#pet .eye:first-child{left:-39px}#pet .eye:last-child{left:11px}
#pet.blink .eye{transform:scaleY(.1)}
#pet.happy .eye{border-bottom-color:transparent;transform:scaleY(.7) translateY(-3px)}
#pet .pod,#pet .antenna{display:none}
#pet .lens{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#bfe6ff 24%,#49B5FF 48%,rgba(73,181,255,0) 74%);opacity:0;transform:scale(.4);transition:all .4s var(--ease)}
#pet .paw{position:absolute;top:140px;width:32px;height:28px;border-radius:46% 46% 50% 50%/40% 40% 60% 60%;background:radial-gradient(100% 100% at 40% 25%,#fff 0%,#e9e6e1 45%,#c9c4bc 100%);box-shadow:0 5px 10px rgba(17,17,17,.2);transition:all .4s var(--ease)}
#pet .paw.l{left:48px}#pet .paw.r{left:120px}
#pet .pod{position:absolute;top:76px;width:14px;height:34px;border-radius:8px;background:linear-gradient(90deg,#e4e7ec,#fff);box-shadow:0 2px 4px rgba(17,17,17,.1);transition:all .35s var(--ease)}
#pet .pod.l{left:20px}#pet .pod.r{left:166px;background:linear-gradient(90deg,#fff,#dfe3e8)}
#pet .antenna{position:absolute;left:88px;top:25px;width:24px;height:16px;border-radius:12px 12px 4px 4px;background:linear-gradient(#fff,#e1e5ea);box-shadow:0 2px 4px rgba(0,0,0,.08);transition:all .35s var(--ease)}
#pet .shadow{position:absolute;left:48px;top:158px;width:104px;height:18px;border-radius:50%;background:radial-gradient(rgba(17,17,17,.2),rgba(17,17,17,0) 70%);transition:all .45s var(--ease)}
#pet .hit{position:absolute;left:30px;top:30px;width:140px;height:130px;border-radius:50%;pointer-events:none;cursor:pointer}
#pet.clickable .hit{pointer-events:auto}
#pet.sphere .body{left:40px;top:40px;width:120px;height:120px;border-radius:60px;background:radial-gradient(100% 100% at 36% 26%,#fff 0%,#f2f4f7 40%,#d2d8df 100%)}
#pet.sphere .body::after{opacity:1}
#pet.sphere .face{left:38px;top:-2px;width:44px;height:44px;border-radius:22px}
#pet.sphere.aim-right .face{left:68px;top:24px}
#pet.sphere .eye{opacity:0;transform:scale(.3)}
#pet.sphere .lens{opacity:1;transform:scale(1)}
#pet.sphere .paw{transform:translateY(-30px) scale(.2);opacity:0}
#pet.sphere .pod{transform:scale(0);opacity:0}
#pet.sphere .antenna{transform:translateY(22px) scale(.2);opacity:0}
#pet.sphere .shadow{left:56px;top:152px;width:88px}
#trail{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:29;filter:blur(6px);will-change:filter}
#beamwrap{position:fixed;inset:0;pointer-events:none;z-index:28;filter:blur(16px)}
#beam{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;background:linear-gradient(90deg,rgba(165,222,255,.85),rgba(73,181,255,.34) 35%,rgba(73,181,255,.12) 100%)}
#shutter{position:fixed;inset:0;width:100vw;height:100vh;z-index:60;display:none;pointer-events:none}
#vshut{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;overflow:hidden}
#vshut canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#vshut video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0}
body.busy #pet{z-index:70}body.busy #trail{z-index:65}
body.busy{cursor:progress}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.b{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;font-size:.88rem}
.b:hover:not(:disabled){border-color:var(--ink)}
.b:disabled{opacity:.35;cursor:default}
.b.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}

d card, fast transfers, security, travel internet and round-the-clock support.","placement":"App Store · Google Play"},{"type":"image","src":"oson-more-than-transfers.webp","ratio":"1300/2311","group":"Creatives","title":"More than transfers","idea":"A 3D stack of coins, a Steam block, a Rahmat tile and an eSIM tile: everything you can pay for in OSON besides transfers, with 1.5% cashback.","placement":"Instagram Stories · Telegram"},{"type":"image","src":"oson-pay-your-way.webp","ratio":"1080/1350","group":"Creatives","title":"Pay the way you want","idea":"Plush keychain charms shaped like local payment services, among them Paynet, UzQR, Tez QR and Rahmat, say that every way of paying works.","placement":"Instagram · Telegram"},{"type":"image","src":"oson-utilities-cube.webp","ratio":"1080/1350","group":"Creatives","title":"Don’t forget utilities: water and power","idea":"A glossy 3D cube with water and lightning icons turns a routine bill into a small object worth remembering.","placement":"Instagram · Telegram"},{"type":"image","src":"oson-utilities-house.webp","ratio":"1080/1350","group":"Creatives","title":"Don’t forget utilities: the house","idea":"A glass button with a house on an OSON-branded base: one tap for all home payments.","placement":"Instagram · Telegram"},{"type":"image","src":"oson-utilities-phone.webp","ratio":"1080/1080","group":"Creatives","title":"Pay utilities in OSON","idea":"A phone with the utilities list in front of glass gas, water and power icons, a green check and a stack of coins.","placement":"Instagram · Telegram"},{"type":"image","src":"oson-kz-target.webp","ratio":"1080/1350","group":"Creatives","title":"Targeted ad: money transfers abroad","idea":"A wallet and coins on a switch panel, with an arrow showing money moving to relatives abroad: fast, safe and reliable.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"oson-sunday-poster.webp","ratio":"1400/1980","group":"Creatives","title":"Profitable Sunday: poster","i he Sunday cashback, from gas to mobile.","placement":"Instagram Reels · Telegram","au":true},{"type":"video","src":"v-oson-fines.mp4","poster":"v-oson-fines.jpg","ratio":"720/1280","group":"Creatives","title":"Pay fines in OSON","idea":"A speed camera, a speedometer and a phone show how a fine is paid in a few taps.","placement":"Instagram Reels · Telegram","au":true},{"type":"image","src":"oson-bento-business.webp","ratio":"1800/1440","group":"Creatives","title":"Bento: OSON Business","idea":"A bento grid of numbers for the business product: 320+ mln annual turnover, 19+ partner countries, 500+ partner companies and an API for fast integration.","placement":"Presentation · Infographic"},{"type":"image","src":"oson-bento-kassa.webp","ratio":"1800/1440","group":"Creatives","title":"Bento: OSON Kassa","idea":"The payment gateway as a bento grid: one multi-currency gateway for the CIS, three payment methods, monetization and flexible payments.","placement":"Presentation · Infographic"},{"type":"image","src":"oson-bento-esim.webp","ratio":"1800/1440","group":"Creatives","title":"Bento: OSON eSIM","idea":"Easy activation, 177+ countries, one minute to buy and connect and three types of coverage, each in its own tile.","placement":"Presentation · Infographic"},{"type":"image","src":"oson-bento-wallet.webp","ratio":"1800/1440","group":"Creatives","title":"Bento: OSON Wallet","idea":"All QR payments, transfers between cards, 3+ mln users and ten years on the market, around a phone showing everything in one app.","placement":"Presentation · Infographic"},{"type":"image","src":"oson-bento-terminal.webp","ratio":"1800/1440","group":"Creatives","title":"Bento: OSON Terminal","idea":"3,800+ terminals across Uzbekistan, 1.3+ mln monthly transactions and cardless cash withdrawal, shown as 3D tiles.","placement":"Presentation · Infographic"},{"type":"image","src":"oson-stickers-pack.webp","ratio":"1300/1951","group":"Creatives","title":"Sticker pack: developers’ humor","idea":"A pack of jokes for the team: a coding loop, “Plan B”, plov time and “Do not disturb, I’m coding”, set around the OSON mark.","placement":"Telegram · Stickers"},{"type":"image","src":"oson-stickers-astronaut.webp","ratio":"1400/2100","group":"Creatives","title":"Sticker pack: the astronaut","idea":"An astronaut mascot living through office life: “I need more space”, deadlines on fire, another call and yet another round of edits.","placement":"Telegram · Stickers"},{"type":"image","src":"oson-cards-topup.webp","ratio":"1300/2046","group":"Creatives","title":"Top up UZCARD, HUMO and VISA in OSON","idea":"Translucent bank cards fanned out in 3D under the logos of the three card systems, with a QR code to download the app.","placement":"Poster · Print"},{"type":"image","src":"oson-terminal-atto.webp","ratio":"1300/1950","group":"Creatives","title":"OSON terminal for the ATTO transport card","idea":"A render of an OSON terminal co-branded with ATTO, with a screen for card top-up and a front panel for the unified transport card.","placement":"Terminal branding · Render","pv":true},{"type":"image","src":"oson-bus-shelter.webp","ratio":"1800/1200","group":"Creatives","title":"Bus shelter mockup","idea":"A blue OSON canopy over a bus shelter with the campaign ads on both side panels.","placement":"Outdoor · Mockup"},{"type":"image","src":"oson-pocket.webp","ratio":"1080/1350","group":"Creatives","title":"Do kids spend their pocket money fast?","idea":"A blue poster in Uzbek: a coin purse shaped like a clock with banknotes and a bank card in its zip, asking whether children spend their weekly pocket money quickly.","placement":"Social post · 4:5"},{"type":"image","src":"oson-x-dfsa.webp","ratio":"1920/1080","group":"Creatives","title":"OSON X: DFSA licence","idea":"A wide banner announcing that OSON X operates under an official DFSA licence: the reference number, licence type and authorised services in glass cards, beside a framed licence with the UAE flag.","placement":"Social post · 16:9"}],"kind":"design","brief":"QR payment campaign.","idea":"Show flexibility of payment methods.","result":"Key visuals and SMM rollout.","subs":[{"slug":"c-wallet","title":"C Wallet","sub":"Logo Identity","desc":"C Wallet is a crypto wallet identity by OSON, designed to bridge financial technology and everyday simplicity. The concept combines secure asset storage as a visual idea, freedom of movement, and an approachable design language while maintaining a recognizable connection to the OSON ecosystem.","role":"Concept · Logo · Identity","industry":"Fintech / Crypto","period":"2025","deliverables":"Logo, app icon, guidelines, key visuals","overview":"The challenge was to create a crypto product identity that feels modern, trustworthy, and easy to understand. Rather than relying on complex technological metaphors, I focused on simple geometry and recognizable symbolism. The result is a distinctive visual language that reflects the nature of a digital wallet while remaining connected to OSON.","mark":"The symbol is built around a stylized letter C, combining two ideas: a wallet as a space for holding value and an open system for moving digital assets. Its open form represents freedom of interaction, while rounded geometry gives the technical mark a more approachable character. The result is a simple, recognizable symbol with a distinct identity.","symbols":"C|The letter C connects the product name with the idea of a digital wallet.\nOSON heritage|Brand colors and geometry maintain a connection to the OSON ecosystem.\nInner space|The inner space represents value under the user’s control.\nGeometry|Precise geometry communicates technology, structure, and reliability.\nRoundness|Rounded forms make a complex financial product feel more approachable.","construction":"A modular grid defines the symbol’s proportions, curves, and consistent stroke weight. This systematic approach helps maintain visual integrity across different scales, from a compact app icon to large-format brand communications.","typecolor":"The geometric Stapel typeface reinforces the brand’s confident, contemporary character. The blue palette maintains a visual connection to OSON, while the transition from deep to lighter tones introduces a sense of technology and movement. Together, they establish a cohesive visual language for the digital product.","palette":"#000000|Black\n#1A2FD0|Deep blue\n#2A63F0|OSON blue\n#3FA9FF|Sky\n#FFFFFF|White","versions":"The identity was designed as a flexible system for different digital environments. Full-color and monochrome versions preserve the brand’s clarity and recognition across light and dark backgrounds.","apps":[{"type":"image","src":"st-a2240841e3e0.webp","ratio":"1792/2400","group":"Project","title":"C Wallet Key Visual","idea":"The key visual explores the connection between digital assets and the freedom to manage them, turning the brand symbol into a recognizable product image.","placement":"Key visual"},{"type":"image","src":"st-fb2b3f5bb768.webp","ratio":"528/677","group":"Project","title":"Trade Without Fear","idea":"The concept focuses on confidence in managing digital assets. The metaphor of a protected space communicates a sense of control and reliability.","placement":"Key visual"},{"type":"image","src":"st-eea42ebd3d44.webp","ratio":"525/677","group":"Project","title":"App Icon","idea":"The app icon translates the brand concept into a compact digital format. Simple geometry and strong contrast preserve recognition at small sizes.","placement":"App Store · Google Play"},{"type":"image","src":"st-6705fd2bb597.webp","ratio":"875/677","group":"Project","title":"Icon Preview","idea":"The identity must work beyond presentations, in everyday digital environments. Its application on a smartphone demonstrates practical usability and visual independence.","placement":"iOS · Android"},{"type":"image","src":"st-7db2b12f5de2.webp","ratio":"1105/1012","group":"Project","title":"Chrome C","idea":"The dimensional interpretation strengthens the brand’s technological character, showing how a simple symbol can become a distinctive element of visual communication.","placement":"Key visual"},{"type":"image","src":"st-92d2f7af6ec5.webp","ratio":"872/1012","group":"Project","title":"Top Up Your Balance","idea":"The communication shifts attention from the technology to the user’s action. A simple visual metaphor presents digital asset management as an accessible everyday experience.","placement":"Social · Ads"}],"myrole":"Creative concept\nLogo & mark\nIdentity system\nApp icon\n3D key visuals","img":{"hero":{"src":"st-72ef244f2c1b.webp","ratio":"2384/1198"},"logo":{"src":"st-5a4e01f2e1a9.webp","ratio":"986/343"},"icon":{"src":"st-0d1b8240589d.webp","ratio":"1/1"},"grid":{"src":"st-c5322fe1590b.webp","ratio":"900/900"},"clear":{"src":"st-dd5a7184bfd3.webp","ratio":"1100/750"},"font":{"src":"st-d4035f2add87.webp","ratio":"2100/400"},"versions":{"src":"st-19fb1fc7ce07.webp","ratio":"2200/800"}},"anno":[{"i":2,"x":0.4975,"y":0.4975,"s":"l","ly":40},{"i":0,"x":0.345,"y":0.4975,"s":"l","ly":180},{"i":3,"x":0.365,"y":0.655,"s":"l","ly":320},{"i":4,"x":0.6575,"y":0.4225,"s":"r","ly":40},{"i":1,"x":0.655,"y":0.4975,"s":"r","ly":180}],"appsText":"The symbol becomes the foundation of the brand’s visual communication, from the app icon to campaign materials. Through dimensional forms, digital textures, and minimal compositions, the identity communicates the product’s core values: accessibility, freedom of interaction, and trust.","cardDesc":"Identity for the crypto wallet by OSON: a digital container that keeps assets safe and lets them move freely."},{"slug":"oson-games","title":"OSON Games","sub":"Logo Identity","desc":"OSON Games is a visual identity project for the gaming division of the OSON ecosystem. The concept is built around an OG monogram that connects the brand name with the image of a player immersed in a virtual world. A geometric design system, expressive typography, and a vibrant color palette establish a distinctive identity designed for gaming audiences and flexible brand communication.","role":"Concept · Logo · Identity","industry":"Gaming","period":"2025","deliverables":"Logo, grid, color system, guidelines","overview":"The challenge was to create a recognizable identity that connects OSON’s established character with the dynamic culture of gaming. I chose a minimal geometric approach, moving beyond conventional gaming symbols to develop a mark with multiple layers of meaning. The result brings together the project name, the image of a player, and the idea of interaction within a digital environment.","mark":"The symbol combines the letters O and G into a single graphic composition. Its geometry incorporates the silhouette of a player sitting at a desk, representing focus and immersion in gameplay. The accent element suggests a gaming input device, while the lower part of the G completes the composition, transforming an abstract monogram into a representation of a personal gaming space.","symbols":"O|The first letter maintains a connection to OSON.\nG|The second letter completes the monogram and suggests a gaming environment.\nController|A universal symbol of interaction between the player and the digital world.\nSilhouette|The hidden player silhouette represents focus and immersion.\nDesk|The element gives the monogram a more complete visual narrative.","construction":"The logo is built on a consistent modular grid. Unified curves, proportions, and stroke weights establish visual harmony, while defined clear-space rules protect the mark across different applications. This systematic construction maintains recognition in both compact digital formats and large-scale brand communications.","typecolor":"The identity uses Stapel, a geometric typeface that reinforces the brand’s confident and contemporary character. An eight-color palette reflects the diversity of gaming culture and provides flexibility across events and campaigns. A contrasting accent within the monogram preserves its distinctive character across different color combinations.","palette":"#FF5D1A|Vivid Orange\n#77D24C|Lime Green\n#7900AC|Vivid Violet\n#7996FC|Azure Blue\n#0A0A9E|Indigo Blue\n#065E06|Forest Green\n#D982EE|Soft Pink\n#CB0101|Crimson Red","versions":"The logo was designed as a flexible identity system capable of expressing different visual moods without losing recognition. Contrasting color combinations allow the brand to adapt to various gaming contexts, while consistent geometry and composition maintain a recognizable identity.","myrole":"Creative Concept\nLogo Design\nLogo Construction\nBrand Identity\nColor System","img":{"hero":{"src":"st-af4b148d837b.webp","ratio":"2000/1036"},"overview":{"src":"st-9c6273e58740.webp","ratio":"1600/619"},"icon":{"src":"st-dd799c10ec32.webp","ratio":"1400/414"},"grid":{"src":"st-0e2e8b3246be.svg","ratio":"29664.66/13497.86"},"font":{"src":"st-d4035f2add87.webp","ratio":"2100/400"},"clear":{"src":"st-c4e31fd7841c.webp","ratio":"2000/1016"}},"apps":[{"type":"image","src":"st-d5338b29bfe5.webp","ratio":"1057/1488","group":"Project","title":"PUBG Mobile Sunday Event","idea":"The visual brings the OSON Games identity into competitive gaming. An expressive character and dynamic typography communicate the excitement, intensity, and culture surrounding a gaming event.","placement":"Event poster · Social"},{"type":"image","src":"oson-games-uc-post.webp","ratio":"1080/1350","group":"Project","title":"UC Cheaper on OSON","idea":"The campaign focuses on a practical benefit for players: more affordable in-game currency. Familiar gaming imagery captures attention, while a clear composition communicates the offer immediately.","placement":"Instagram · Telegram"}],"plates":[{"src":"st-9c6273e58740.webp","ratio":"1600/619"},{"src":"st-af67835f189e.webp","ratio":"1600/619"},{"src":"st-881cd79905af.webp","ratio":"1600/619"},{"src":"st-b682ff86622d.webp","ratio":"1600/619"},{"src":"st-08b105a61618.webp","ratio":"1600/619"}],"anno":[{"i":3,"x":0.252,"y":0.09,"s":"l","ly":40},{"i":0,"x":0.035,"y":0.405,"s":"l","ly":180},{"i":1,"x":0.567,"y":0.837,"s":"l","ly":320},{"i":2,"x":0.936,"y":0.189,"s":"r","ly":40},{"i":4,"x":0.936,"y":0.515,"s":"r","ly":180}],"appsText":"The identity extends into promotional materials for gaming events and digital products. Visual communication combines the OSON Games brand language with recognizable elements of gaming culture. This approach creates an engaging connection with gaming audiences while maintaining consistency across different campaigns.","cardDesc":"Identity for OSON Games — a player absorbed in the game, built into one mark."},{"slug":"esim","title":"OSON eSIM","sub":"Identity and campaigns","cardDesc":"Logo, mascot and campaigns for OSON’s travel eSIM.","desc":"OSON eSIM is a visual identity and advertising project for a travel mobile internet service. The concept centers on freedom of movement and staying connected without a physical SIM card. From the logo and brand mascot to digital campaigns, I developed a visual language that makes a technical product more approachable and relevant to travelers.","role":"Logo · Mascot · Campaigns","industry":"Telecom / Travel","deliverables":"Logo and app icon, mascot, social posts, airport screen ad, video ads","img":{},"card":{"type":"image","src":"esim-card-chip.webp","ratio":"1672/941"},"chapters":[{"title":"Overview","text":"The challenge was to establish a recognizable eSIM identity within the OSON ecosystem and communicate the service’s benefits through clear visual storytelling. I combined a minimal, technology-driven identity with the emotional world of travel. Rather than focusing on technical complexity, the communication emphasizes what matters to travelers: freedom, convenience, and staying connected.","media":[],"noimg":true},{"title":"The Mark","text":"The logo is built around a stylized lowercase “e”, integrated with a wireless signal symbol. Its fluid geometry communicates simplicity, while the ascending lines suggest continuous connectivity. The mark was designed as a compact, recognizable symbol that works both independently and alongside the wordmark.","media":[],"anno":{"img":{"src":"esim-logo-dark.webp","ratio":"1391/845"},"symbols":"Signal|The wireless signal represents the service’s core purpose.\nThe e|The core symbol connects the product name with digital technology.\nSlanted Bar|The directional shape connects the letter and signal into one composition.\nRound Dot|Rounded geometry reinforces an approachable brand character.\nWordmark|Clean typography supports recognition across digital environments.\nColor|Signature colors maintain the OSON connection and express a modern technological identity.","pts":[{"i":0,"x":0.505,"y":0.215,"ly":20,"s":"r"},{"i":3,"x":0.64,"y":0.53,"ly":135,"s":"r"},{"i":4,"x":0.88,"y":0.72,"ly":250,"s":"r"},{"i":1,"x":0.06,"y":0.6,"ly":20,"s":"l"},{"i":2,"x":0.22,"y":0.66,"ly":135,"s":"l"},{"i":5,"x":0.14,"y":0.4,"ly":250,"s":"l"}]}},{"title":"Colour and Mono","text":"The color palette maintains a visual connection to OSON through its established blue tones. Bright cyan introduces a sense of lightness and modern technology, while deep navy provides visual stability. Monochrome variations extend the identity’s flexibility, preserving recognition across digital and printed applications.","media":[{"type":"image","src":"esim-board-colors2.webp","ratio":"2000/878"},{"type":"image","src":"esim-board-mono2.webp","ratio":"2000/666"}]},{"title":"App Icon and Screens","text":"For a digital service, recognition at small sizes is essential. The logo’s geometry was adapted for an app icon while preserving its clarity and distinctive character. Alternative color versions allow the identity to work across interfaces and digital environments while remaining connected to the parent brand.","media":[{"type":"image","src":"esim-board-icons2.webp","ratio":"2000/1519"}]},{"title":"Mascot","text":"To make the technology feel more approachable, I created a travel companion inspired by a SIM card. Its friendly personality transforms an abstract digital service into a relatable character that accompanies users on their journeys. The mascot opens new possibilities for storytelling through emotion, humor, and familiar travel situations.","media":[{"type":"image","src":"esim-mascot.webp","ratio":"1500/1875"}]},{"title":"Campaign Posts","text":"The campaign explores the idea of traveling with fewer limitations. I developed distinctive visual worlds for different destinations, combining recognizable local elements with the digital product. The smartphone connects the emotional travel experience with the practical action of choosing and activating an eSIM. This approach makes the communication both inspiring and informative.","media":[{"type":"image","src":"esim-post-egypt.webp","ratio":"1400/1750","title":"Egypt","idea":"The contrast between adventure and digital convenience reinforces the idea of travel freedom. Even the most exciting journeys should leave room for staying connected."},{"type":"image","src":"esim-post-turkey.webp","ratio":"1400/1750","title":"Turkey","idea":"The visual connects diverse travel experiences with simple digital connectivity. eSIM becomes a seamless part of the journey, allowing travelers to focus on discovery."},{"type":"image","src":"esim-post-vietnam.webp","ratio":"1024/1536","title":"Vietnam","idea":"The campaign combines the destination’s emotional appeal with a clear mobile data offer, connecting travel inspiration with practical value."}],"car":true},{"title":"Airport Screen","text":"An airport provides a relevant point of contact with travelers who need mobile connectivity. I used the visual language of a boarding pass to make the promotional message feel natural within the travel environment. Bold typography, clear hierarchy, and a QR code communicate the offer quickly and guide users toward activation.","media":[{"type":"image","src":"esim-airport-screen.webp","ratio":"2000/942"}]},{"title":"Video Ads","text":"The video communication explores several creative approaches: product-focused storytelling, emotional travel scenarios, and humorous narratives. Each direction communicates the same central idea from a different perspective — staying connected beyond familiar surroundings. This creates a flexible campaign system for different audiences and social media formats while maintaining a consistent brand character.","media":[{"type":"video","src":"v-esim-app-intro.mp4","poster":"v-esim-app-intro.jpg","ratio":"720/1280","title":"App Intro","au":true,"idea":"A short product introduction using motion, brand graphics, and travel imagery to build recognition and establish a clear first impression."},{"type":"video","src":"v-esim-travelers.mp4","poster":"v-esim-travelers.jpg","ratio":"720/900","title":"Travelers","au":true,"idea":"Emotional storytelling focuses on people and moments worth sharing. Connectivity is presented not as technology, but as a way to stay close across distances."},{"type":"video","src":"v-esim-landmarks.mp4","poster":"v-esim-landmarks.jpg","ratio":"720/1278","title":"Landmarks","au":true,"idea":"Familiar landmarks become characters in a playful narrative. Humor communicates the idea of borderless connectivity in an engaging and memorable way."},{"type":"video","src":"v-esim-yoda.mp4","poster":"v-esim-yoda.jpg","ratio":"720/900","title":"Yoda","au":true,"idea":"A humorous concept uses a familiar pop-culture character to explore connectivity challenges abroad, making an everyday travel problem more engaging."},{"type":"video","src":"v-esim-vader.mp4","poster":"v-esim-vader.jpg","ratio":"720/900","title":"Vader","au":true,"idea":"The contrast between a dramatic sci-fi character and an everyday situation creates humor, communicating the service’s value through entertainment."}],"car":true}],"myrole":"Logo Design\nApp Icon\nMascot Design\nCampaign Concepts\nDigital Design\nVideo Advertising"}],"cove llow: the yellow supercar","idea":"A yellow sports car in WOG livery on black, with the product range lined up in front of it.","placement":"Instagram · Telegram"},{"type":"image","src":"wog-brake-antifreeze.webp","ratio":"1122/1402","group":"Creatives","title":"Anti-freeze for pneumatic brake systems","idea":"A yellow MAN truck on a yellow road beside two Air Brake System Anti-Freeze cans, with four icon-led benefits above: longer brake cylinder life, work down to −50 °C, corrosion protection and soft rubber seals.","placement":"Instagram · Telegram"}],"subs":[{"slug":"motor-oils","title":"Motor Oils","sub":"Packaging design","desc":"WOG Motor Oils is a unified packaging system for automotive oils and technical fluids. The challenge was to bring a diverse product range under one recognizable visual identity, simplify product selection, and maintain brand consistency across every format.","role":"Packaging design · Label system","industry":"Automotive / Lubricants","deliverables":"28 print-ready labels (14 products, 1 and 4 L), B2B presentation","img":{"hero":{"type":"image","src":"wog-oils-rocks.webp","ratio":"1086/1448"}},"cardDesc":"Packaging for the full WOG motor oil range: 14 products, 28 print-ready labels.","chapters":[{"title":"Overview","text":"The goal was to create packaging that serves two purposes: making WOG stand out in a competitive market and helping customers navigate its product range. I developed a unified visual system in which every product maintains its individuality while remaining part of a consistent brand family.","media":[{"type":"image","src":"wog-oils-trio-4l.webp","ratio":"2000/862"}]},{"title":"Label Anatomy","text":"The core principle is a clear hierarchy of information. The brand establishes immediate recognition, followed by the oil type, viscosity, and product line. Technical specifications occupy a dedicated area, balancing a strong visual identity with practical readability.","anno":{"img":{"src":"wog-oils-front-4l.webp","ratio":"1478/1820"},"symbols":"Brand strip|The vertical brand strip establishes recognition across the product range.\nCategory|The category helps users identify the product’s purpose.\nDesigned in Germany|A visual reference to German engineering culture within the brand story, not a statement of actual origin.\nApprovals|A dedicated area for technical requirements and listed specifications.\nProduct type|Clear product identification makes selection easier.\nViscosity and class|Key specifications are emphasized for quick comparison.\nLine name|Product line names establish distinction within the unified system.\nIcon, QR and volume|Supporting information is grouped without overwhelming the main layout.","pts":[{"i":0,"x":0.16,"y":0.24,"ly":20,"s":"l"},{"i":1,"x":0.17,"y":0.62,"ly":125,"s":"l"},{"i":2,"x":0.17,"y":0.86,"ly":228,"s":"l"},{"i":3,"x":0.45,"y":0.9,"ly":352,"s":"l"},{"i":4,"x":0.6,"y":0.3,"ly":50,"s":"r"},{"i":5,"x":0.5,"y":0.43,"ly":145,"s":"r"},{"i":6,"x":0.79,"y":0.67,"ly":245,"s":"r"},{"i":7,"x":0.86,"y":0.8,"ly":345,"s":"r"}]}},{"title":"Construction","text":"The packaging was designed with both visual consistency and production requirements in mind. Each label follows the shape of its container, while the separation of front and back panels keeps the primary design clean without compromising essential technical information.","media":[{"type":"image","src":"wog-oils-flat-4l.webp","ratio":"1890/1181"},{"type":"image","src":"wog-oils-flat-1l.webp","ratio":"1730/1091"}]},{"title":"Formats","text":"A consistent layout system was developed for both 1L and 4L containers. Rather than simply scaling the artwork, the composition adapts to each format’s proportions. This preserves visual hierarchy, brand recognition, and readability across different package sizes.","media":[{"type":"image","src":"wog-oils-formats.webp","ratio":"1540/1204"}]},{"title":"The System","text":"A unified label architecture was created for 14 products. Consistent brand elements establish recognition, while variable information distinguishes the Urban HT, Ultra Protect, and transmission fluid ranges. The modular approach makes it possible to expand the portfolio without redesigning each product from scratch.","media":[{"type":"image","src":"wog-oils-fronts-grid.webp","ratio":"2000/1316"},{"type":"image","src":"wog-oils-lineup-4l.webp","ratio":"2000/740"}]},{"title":"Color","text":"The brand palette combines yellow, black, and red to create a bold, technical identity with strong shelf visibility. As part of WOG’s brand narrative, these colors also evoke associations with German engineering culture, precision, and discipline.","palette":"#FFE400|Yellow · Pantone 109C\n#2D2B2D|Black · Pantone Black C\n#E21F2C|Red · Pantone 485C\n#00ADD7|Blue · Pantone 639C\n#D2D3D2|Gray · Cool Gray 2C","media":[{"type":"image","src":"wog-palette-combos.webp","ratio":"1960/360"}]},{"title":"Applications","text":"The packaging system was extended into a B2B presentation of the product range. Consistent typography, colors, and information hierarchy create a cohesive way to communicate the portfolio, product benefits, and technical specifications to potential business partners.","car":true,"media":[{"type":"image","src":"0f0296130585e5b2738a46ac868ea4a5.webp","ratio":"1920/1222","group":"Project","title":"Slide 01 · Cover","idea":"","placement":"Presentation"},{"type":"image","src":"48cbafc821baa495160095715c4feaf3.webp","ratio":"1920/1222","group":"Project","title":"Slide 02 · Mission","idea":"","placement":"Presentation"},{"type":"image","src":"91446032f0ad88519a063395e9ee2de8.webp","ratio":"1920/1222","group":"Project","title":"Slide 03 · About the company","idea":"","placement":"Presentation"},{"type":"image","src":"41cbfde837c174bed66cdaf24e2042fe.webp","ratio":"1920/1222","group":"Project","title":"Slide 04 · Production","idea":"","placement":"Presentation"},{"type":"image","src":"60fe4b00200555a4e4c6feb6768802da.webp","ratio":"1920/1222","group":"Project","title":"Slide 05 · RENOMIX technology","idea":"","placement":"Presentation"},{"type":"image","src":"5f2c7f95ad003b268858383ecf7e110b.webp","ratio":"1920/1222","group":"Project","title":"Slide 06 · The range","idea":"","placement":"Presentation"},{"type":"image","src":"80f434ff7dd0eed1a36a6ad7d0270552.webp","ratio":"1920/1222","group":"Project","title":"Slide 07 · Advantages","idea":"","placement":"Presentation"},{"type":"image","src":"691fafff51174a25e0ed99bd640fcfce.webp","ratio":"1920/1222","group":"Project","title":"Slide 08 · Made to order","idea":"","placement":"Presentation"},{"type":"image","src":"430f6dfbee8e015ec7617a9944682822.webp","ratio":"1920/1222","group":"Project","title":"Slide 09 · Why WOG","idea":"","placement":"Presentation"},{"type":"image","src":"03a51e66201bb186a32246b33be7cef6.webp","ratio":"1920/1222","group":"Project","title":"Slide 10 · Quality control","idea":"","placement":"Presentation"},{"type":"image","src":"4d823ca15b623da2dfd49152a5f261a3.webp","ratio":"1920/1222","group":"Project","title":"Slide 11 · B2B terms","idea":"","placement":"Presentation"},{"type":"image","src":"13cd56fd75ccfbdf19c8e4713584cb3d.webp","ratio":"1920/1222","group":"Project","title":"Slide 12 · Support","idea":"","placement":"Presentation"},{"type":"image","src":"ef730697f6336229c91f771cb3dbdb06.webp","ratio":"1920/1222","group":"Project","title":"Slide 13 · Urban HT line","idea":"","placement":"Presentation"},{"type":"image","src":"6e04eea3f515f73323194c365fe6546c.webp","ratio":"1920/1222","group":"Project","title":"Slide 14 · Ultra Protect line","idea":"","placement":"Presentation"}]}],"myrole":"Packaging design\nLabel system for the range\nTypography and color\nIcons and markings\nB2B presentation","card":{"src":"0f0296130585e5b2738a46ac868ea4a5.webp","ratio":"1920/1222"},"heroW":"min(520px,100%)"},{"slug":"moto-line","title":"Moto Line","sub":"Packaging design","desc":"WOG Moto Line extends the WOG brand identity into the motorcycle category. The project brings motor oils and specialized maintenance products together under one cohesive packaging system. The design combines brand recognition, distinctive graphics, and intuitive navigation across products for different types of motorcycles.","role":"Sub-brand · Packaging design","industry":"Automotive / Motorcycles","deliverables":"Labels for 4 oils in 1 and 4 L and 5 care products, launch posters","img":{"hero":{"src":"moto-hero-posters.webp","ratio":"2016/1400"},"top":{"type":"image","src":"moto-line-rocks.webp","ratio":"1086/1448"}},"cardDesc":"Motoline: motor oils for every riding style and a G1–G5 care kit.","card":{"src":"moto-card.webp","ratio":"2000/1036"},"chapters":[{"title":"Overview","text":"The challenge was to adapt WOG’s visual identity for a new audience while maintaining a clear connection to the parent brand. I developed a distinct character for Motoline — more technical, dynamic, and closely connected to motorcycle culture. A unified system brings together two product categories: motor oils and motorcycle care products.","media":[{"type":"image","src":"moto-oils-4l.webp","ratio":"2000/638"},{"type":"image","src":"moto-care-renders.webp","ratio":"2000/780"}]},{"title":"Label Anatomy","text":"The design balances expressive graphics with functional information. Motorcycle illustrations help distinguish the product lines, while oil type, viscosity, and technical specifications remain easy to read. This hierarchy gives the packaging a distinctive character without compromising practical clarity.","anno":{"img":{"src":"moto-front-4l.webp","ratio":"1604/1951"},"symbols":"WOG / Motoline strip|Connects WOG’s established identity with the distinct character of Motoline.\nDesigned in Germany|Part of the brand narrative, referencing German engineering culture rather than actual origin.\nProduct type and viscosity|Essential specifications are highlighted for quick identification and comparison.\nApprovals|Technical information is organized in a dedicated area for clarity.\nThe bike|The illustration reflects the motorcycle category and helps visually distinguish products.\n4T badge|A high-contrast engine-type badge makes essential information easy to find.\nLine and style|Product family and riding style create a clear navigation system.\nQR and volume|Supporting information is integrated without disrupting the visual hierarchy.","pts":[{"i":0,"x":0.191,"y":0.249,"ly":20,"s":"l"},{"i":1,"x":0.191,"y":0.809,"ly":125,"s":"l"},{"i":2,"x":0.491,"y":0.6,"ly":228,"s":"l"},{"i":3,"x":0.509,"y":0.865,"ly":352,"s":"l"},{"i":4,"x":0.594,"y":0.353,"ly":50,"s":"r"},{"i":5,"x":0.837,"y":0.581,"ly":145,"s":"r"},{"i":6,"x":0.622,"y":0.742,"ly":245,"s":"r"},{"i":7,"x":0.837,"y":0.809,"ly":345,"s":"r"}]}},{"title":"Lockup","text":"Product naming becomes a central element of identification. Bold typography creates a strong visual focus, while a contrasting label highlights the riding style. This approach helps differentiate products across the range while maintaining a consistent visual structure.","media":[{"type":"image","src":"moto-lockup.webp","ratio":"1384/820"}]},{"title":"Motor Oils","text":"The collection reflects the diversity of motorcycle culture. Distinct illustrations represent street, off-road, cruiser, and sport motorcycles. A consistent layout connects these different categories, making every product recognizable as part of the WOG Motoline family.","media":[{"type":"image","src":"moto-oil-fronts.webp","ratio":"2000/682"},{"type":"image","src":"moto-oils-1l.webp","ratio":"2000/745"}]},{"title":"Formats","text":"The packaging system was adapted for both 1L and 4L containers. Each composition responds to the proportions of its format while preserving information hierarchy, readability, and the visual impact of the illustrations. The result is a consistent identity across different packaging sizes.","media":[{"type":"image","src":"moto-formats.webp","ratio":"1520/1201"}]},{"title":"Illustrations","text":"Rather than using generic automotive imagery, I developed illustrations representing different motorcycle classes. Each illustration follows a process of studying proportions and distinctive features before translating them into high-contrast line artwork. This approach adds individuality and makes motorcycle culture an integral part of the packaging identity.","media":[{"type":"image","src":"moto-process-street.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-enduro.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-cruiser.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-sport.webp","ratio":"2000/480"}]},{"title":"Care Kit G1–G5","text":"A dedicated G1–G5 navigation system was created for motorcycle maintenance products. Clear numbering, descriptive naming, and technical illustrations distinguish chain cleaning and lubrication products from air filter maintenance solutions. Together, the five products form a recognizable and easy-to-navigate range.","media":[{"type":"image","src":"moto-care-renders.webp","ratio":"2000/780"},{"type":"image","src":"moto-care-labels.webp","ratio":"2000/1174"}]},{"title":"Construction","text":"The packaging was designed with production requirements and container geometry in mind. Motor oils use separate front and back labels, while care products feature full-wrap layouts. This approach preserves a clean visual presentation while providing space for essential technical information.","media":[{"type":"image","src":"moto-flat-4l.webp","ratio":"1896/1249"},{"type":"image","src":"moto-flat-1l.webp","ratio":"1628/1080"},{"type":"image","src":"moto-flat-g1.webp","ratio":"2000/1510"}]},{"title":"Color","text":"Motoline inherits WOG’s established palette but introduces a new visual hierarchy. Dark graphite creates a more technical and restrained character, yellow maintains brand recognition, and red highlights key product information. The result is a distinct sub-brand identity that remains connected to WOG.","palette":"#FFE400|Yellow · Pantone 109C\n#2D2B2D|Black · Pantone Black C\n#E21F2C|Red · Pantone 485C\n#00ADD7|Blue · Pantone 639C\n#D2D3D2|Gray · Cool Gray 2C","media":[{"type":"image","src":"wog-palette-combos.webp","ratio":"1960/360"}]},{"title":"Applications","text":"Launch visuals extend the packaging identity into advertising, connecting the products with the aesthetics of motorcycle culture. High-contrast compositions and a strong product focus establish Motoline as a distinct category within the wider WOG brand.","media":[{"type":"image","src":"0aec73dd84096da549a6a29a28859321.webp","ratio":"2000/2828","group":"Project","title":"Launch poster · chain and filter care","idea":"","placement":"Poster"},{"type":"image","src":"7e5219631507c3bd428714896581cb14.webp","ratio":"2000/2828","group":"Project","title":"Launch poster · motor oils","idea":"","placement":"Poster"}],"car":true}],"myrole":"Sub-brand extension\nPackaging design\nLabel system for the oils and the care kit\nMotorcycle line illustrations\nLaunch posters","heroW":"min(640px,100%)","topW":"min(520px,100%)"},{"slug":"wog-art","title":"WOG art.","sub":"Spray paints for creative people","desc":"WOG art. is a spray paint sub-brand concept built around creativity and self-expression. The project expands WOG’s established identity by combining industrial aesthetics with the visual language of street art. From packaging and color systems to advertising, every element reflects the idea of creative freedom.","role":"Sub-brand · Packaging · Advertising","industry":"Automotive / Paints","deliverables":"Cans, gift box, poster, outdoor advertising, instruction, palette","img":{"hero":{"src":"wog-art-cover.webp","ratio":"2000/1116"}},"cardDesc":"Cans, gift box, poster, outdoor advertising, instruction and a 16-shade palette for the WOG art. spray paints.","chapters":[{"title":"Overview","text":"The challenge was to establish a distinct creative direction within the existing WOG brand. I preserved the recognition of the original identity while introducing a more expressive and experimental visual language. The contrast between minimal packaging, dimensional color graphics, and urban textures became the foundation of an identity designed for a creative audience.","media":[{"type":"image","src":"wog-art-board.webp","ratio":"2400/1792"}]},{"title":"Packaging","text":"The packaging concept puts color at the center of the product experience. Abstract three-dimensional forms express the personality of each shade, while a clean layout maintains visual clarity. A dedicated three-can gift box transforms individual products into a cohesive set, extending the identity into a more complete brand experience.","media":[{"type":"image","src":"wog-art-box.webp","ratio":"1600/2143"}]},{"title":"Poster","text":"The campaign communicates the spirit of bold creativity. Expressive typography, vibrant accents, and industrial surroundings reinforce the character of WOG art. The goal was to position spray paint not simply as a product, but as a tool for bringing creative ideas to life.","media":[{"type":"image","src":"wog-art-poster.webp","ratio":"1600/2143"}]},{"title":"Outdoor Advertising","text":"Outdoor advertising takes the identity beyond packaging and into the urban environment. Large-scale graphics and expressive compositions draw from street-art culture, turning advertising surfaces into extensions of the creative concept. The brand becomes part of the visual world it was designed to inspire.","media":[{"type":"image","src":"wog-art-outdoor.webp","ratio":"1122/1402"}]},{"title":"Palette","text":"A consistent visual identification system was developed for the 16-shade collection. Color becomes more than a product attribute — it becomes a central part of the brand’s expression. Numbering and naming support navigation across the range, while a unified graphic language connects the collection.","media":[{"type":"image","src":"wog-art-palette.webp","ratio":"1600/2143"}]},{"title":"Instruction","text":"Functional information should feel like part of the brand experience. I combined step-by-step guidance, clear visual hierarchy, and relevant imagery to make the instructions approachable, even for first-time users. The result maintains the character of WOG art. without feeling like a conventional technical manual.","media":[{"type":"image","src":"wog-art-instruction.webp","ratio":"1122/1402"}]}],"myrole":"Packaging design\nGift box\nPoster and outdoor advertising\nInstruction and palette"},{"slug":"merch","title":"Merch","sub":"Branded merchandise","cardDesc":"Apparel, caps, power banks, cups and mugs in WOG yellow and black.","desc":"Branded merchandise for WOG: T-shirts, caps, power banks, travel cups, tumblers and mugs, built around a hand-lettered WOG mark and the line “Stop on yellow!”.","role":"Merch design","industry":"Automotive","deliverables":"Apparel, caps, power banks, cups, tumblers, mugs","img":{"hero":{"type":"image","src":"wog-merch-mugs-black.webp","ratio":"1280/960"}},"card":{"type":"image","src":"wog-merch-mugs-black.webp","ratio":"1280/960"},"chapters":[{"title":"Overview","text":"Merch takes the brand off the shelf and into everyday use. Every item comes in two versions, yellow and black, and combines the clean WOG logo with a loose, hand-lettered WOG that gives the brand a street, human voice.","grid":true,"media":[{"type":"image","src":"wog-merch-mugs-yellow.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-mugs-black.webp","ratio":"1280/960"}]},{"title":"The mark","text":"Next to the strict WOG logo I drew a second, hand-lettered WOG: loose strokes, a little face hidden in the O, a G that kicks up at the end. The logo signs the product; the mark gives the brand a human, street voice for merch, where people wear and use it every day. It works in both brand pairings, black on yellow and yellow on black.","media":[{"type":"image","src":"wog-mark-vs-logo.webp","ratio":"2000/700"},{"type":"image","src":"wog-mark-pair.webp","ratio":"2000/700"}]},{"title":"Apparel","text":"Oversized T-shirts: a small WOG at the chest and a large hand-lettered mark wrapping the hem, or the slogan “Stop on yellow!” set in bold type on a yellow block, with a WOG tab on the sleeve.","grid":true,"media":[{"type":"image","src":"wog-merch-tee-yellow-front.webp","ratio":"1280/1280"},{"type":"image","src":"wog-merch-tee-white-front.webp","ratio":"1280/1280"},{"type":"image","src":"wog-merch-tee-white-back.webp","ratio":"900/900"}]},{"title":"Caps","text":"Snapbacks in black, black with a yellow visor and full yellow. The hand-lettered WOG gets a yellow crown on the black caps and runs off the edge on the yellow one.","grid":true,"media":[{"type":"image","src":"wog-merch-cap-black.webp","ratio":"1280/1024"},{"type":"image","src":"wog-merch-cap-black-yellow.webp","ratio":"1280/1024"},{"type":"image","src":"wog-merch-cap-yellow.webp","ratio":"1280/853"}]},{"title":"Power banks","text":"Slim power banks in both colors: the logo and slogan at the top, the hand-lettered mark large at the bottom edge.","grid":true,"media":[{"type":"image","src":"wog-merch-pb-yellow-angle.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-pb-black-angle.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-pb-yellow.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-pb-black.webp","ratio":"1280/960"}]},{"title":"Cups and tumblers","text":"Ceramic travel cups with a silicone sleeve and steel tumblers. The sleeve and lid switch color against the body, so each pair reads as a set.","grid":true,"media":[{"type":"image","src":"wog-merch-cup-yellow.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-cup-black.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-tumbler-yellow.webp","ratio":"1280/960"},{"type":"image","src":"wog-merch-tumbler-black.webp","ratio":"1280/960"}]}],"myrole":"Merch concept\nHand-lettered WOG mark\nApparel and accessories design\nMockups and presentation"},{"slug":"exhibition-stand","title":"Exhibition Stand","sub":"Trade show booth","cardDesc":"A trade show booth in WOG yellow and black, from fascia to reception desk.","desc":"A trade show stand for WOG Auto Chemistry: a glowing yellow fascia, a backlit reception desk, product walls and an art piece that stops visitors on the aisle.","role":"Exhibition stand design","industry":"Automotive","deliverables":"Stand concept and 3D visualisation","img":{"hero":{"type":"image","src":"wog-stand-angle.webp","ratio":"2000/1667"}},"card":{"type":"image","src":"wog-stand-angle.webp","ratio":"2000/1667"},"chapters":[{"title":"Overview","text":"The stand turns the brand line “Stop on yellow!” into space. A wall of bright yellow stands out in a dark hall, black frames and shelving hold the products, and backlit edges make the booth glow from a distance.","media":[{"type":"image","src":"wog-stand-angle.webp","ratio":"2000/1667"}]},{"title":"Front view","text":"The fascia carries the WOG / Auto Chemistry logo; the reception desk repeats the backlit WOG. Inside, a sculpted head in a WOG-branded VR headset gives visitors a photo spot, a screen shows the AISI 301 gasket story, and a giant aerosol graphic leads to the product shelves.","media":[{"type":"image","src":"wog-stand-front.webp","ratio":"2000/1667"}]}],"myrole":"Stand concept\nSpace and graphics layout\n3D visualisation"}],"cover":{"src":"st-1756e00bcc3a.webp","ratio":"1672/941"},"markets":["ru"]},{"slug":"push30","title":"PUSH30","category":"Sport and wellness","year":"","role":"Creatives · Social media","desc":"Push30 is a corporate sports subscription in Uzbekistan: employees of partner companies get access to 300+ gyms, yoga and pilates studios, pools, dance and martial-arts centers through a single app. It works in Tashkent and Samarkand. The case collects creatives for the brand: images and videos.","tone":["#b8f200","#0a1a00"],"media":[{"type":"image","src":"push30-cover.webp","ratio":"1672/941","group":"Images","title":"PUSH30 tag on sports fabric","idea":"A neon-green woven tag with the
