· Concept render"},{"type":"image","src":"push30-28.webp","ratio":"2000/1500","group":"Images","gOnly":true,"title":"Vouchers: 7 and 30 days","idea":"Two vouchers on a grey surface, a green 7-day and a violet 30-day one, each with the logo, “more activities, more possibilities” and sport icons.","placement":"Print · Mockup"},{"type":"video","src":"v-push30-0805.mp4","poster":"v-push30-0805.jpg","ratio":"720/1280","group":"Videos","gOnly":true,"au":true,"title":"Instalments up to 24 months","idea":"A vertical motion piece over blurred sport footage: the offer of instalments up to 24 months on the annual subscription from 13,195 ₸ a month, then four toggles switch on what is included and a big Activate button closes it.","placement":"Reels · 9:16"},{"type":"image","src":"push30-29.webp","ratio":"1080/1920","group":"Images","gOnly":true,"title":"Annual subscription: 30% off","idea":"A tennis player at the net reaches her racket towards the viewer, with a glass panel offering 30% off the annual Push30 subscription: Standard 316,680 ₸ or Plus 636,720 ₸.","placement":"Stories · 9:16"},{"type":"image","src":"push30-30.webp","ratio":"1080/1920","group":"Images","gOnly":true,"title":"Corporate fitness platform","idea":"A phone with the app standing in a green gym-office where a woman works at a laptop beside exercise machines, under the line “a new culture of well-being in Uzbekistan’s companies”.","placement":"Stories · 9:16"},{"type":"image","src":"push30-31.webp","ratio":"1080/1350","group":"Images","gOnly":true,"title":"One subscription, 480+ locations","idea":"A runner crouching on a green track with a city behind her, two violet tiles (1 subscription, 480+ locations), five Kazakh cities and a price button from 13,195 ₸ a month.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"push30-32.webp","ratio":"1600/2000","group":"Images","gOnly":true,"title":"Kaspi Zhuma: Plus","idea":"A basketball player in violet with a giant P30 behind him: Plus at 30% off for Kaspi Zhuma, 26,530 ₸ a month for 24 months, and a button to take instalments.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"push30-33.webp","ratio":"1400/1875","group":"Images","gOnly":true,"title":"Kaspi Zhuma: Standard","idea":"A sprinter in the starting crouch against a green speed blur and a white P30: Standard at 30% off, 13,195 ₸ a month for 24 months.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"push30-34.webp","ratio":"1080/1350","group":"Images","gOnly":true,"title":"Kaspi Zhuma: prices","idea":"Two blurred runners with glowing violet shoes and a table: Plus at 26,530 ₸ and Standard at 13,195 ₸ a month, 30% off the annual plans and instalments up to 24 months.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"push30-35.webp","ratio":"1400/1875","group":"Images","gOnly":true,"title":"Kaspi Zhuma: invest in health","idea":"A woman in a yoga pose on sage green with a ribbon looping around her: “invest in health wisely”, 30% off the annual Push30 and Kaspi instalments up to 24 months.","placement":"Targeted ads · Kazakhstan"},{"type":"image","src":"push30-36.webp","ratio":"1080/1350","group":"Images","gOnly":true,"title":"Buy Plus, gift Standard","idea":"A glowing green gift box opens to show Standard and Plus sachets: buy Plus and give Standard to your family free, from 15 December to 15 January.","placement":"Social post · 4:5"},{"type":"image","src":"push30-37.webp","ratio":"1080/1920","group":"Images","gOnly":true,"title":"Even the Grinch is tired of boring gifts","idea":"The Grinch in a Santa suit holds a Push30 card against deep green: the New Year gift that is not banal.","placement":"Stories · 9:16"},{"type":"video","src":"v-push30-countdown.mp4","poster":"v-push30-countdown.jpg","ratio":"720/1280","group":"Videos","gOnly":true,"au":true,"title":"Discount countdown","idea":"A vertical countdown spot over sport footage: the days left before the subscription discount shrinks, counted out in big green numerals.","placement":"Reels · 9:16"}],"kind":"design","brief":"","idea":"","result":"","cover":{"type":"image","src":"push30-cover-2.webp","ratio":"1672/941"},"markets":["uz","kz","az"]},{"slug":"tm-mekhanika","title":"TM Mekhanika","kind":"design","tone":["#1d6fd1","#0b3a73"],"desc":"TM Mekhanika is a comprehensive brand identity project for a metalworking company. I studied the company’s business, developed the visual concept, designed the logo, and created a brandbook covering brand positioning, visual principles, and communication guidelines. The resulting identity was extended into advertising and corporate applications.","role":"Brand identity · Corporate style · Posters","category":"Metalworking · Manufacturing","year":"2023","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"brand-identity","title":"TM Mekhanika","sub":"Brandbook, posters and corporate style","cardDesc":"TM Mekhanika is a comprehensive brand identity project for a metalworking company.","desc":"TM Mekhanika is a comprehensive brand identity project for a metalworking company. I studied the company’s business, developed the visual concept, designed the logo, and created a brandbook covering brand positioning, visual principles, and communication guidelines. The resulting identity was extended into advertising and corporate applications.","role":"Brand platform · Guideline · Corporate style","industry":"Metalworking","deliverables":"Brandbook (brand platform and guideline), corporate style mockups","img":{},"card":{"type":"image","src":"tm-facade.webp","ratio":"2000/829"},"chapters":[{"title":"Overview","text":"I began by studying the company’s manufacturing expertise, services, and approach to working with clients. Based on this understanding, I identified three key directions for the brand identity: engineering precision, technology, and reliable partnership. These principles shaped the logo, brandbook structure, and the overall visual communication system.","media":[{"type":"image","src":"tm-facade.webp","ratio":"2000/829"}]},{"title":"The Logo","text":"My goal was to combine the company’s industrial expertise with a sense of movement and progress. Dynamic typography communicates confidence and technical precision, while the mechanical symbol creates a direct connection to metalworking. The logo became the foundation for the entire visual identity.","media":[],"anno":{"img":{"src":"tm-logo-white.webp","ratio":"1738/427"},"symbols":"TM|Dynamic letterforms communicate movement and progress.\nSlogan|The tagline emphasizes collaboration and partnership.\nBlue gradient|Blue tones establish a technical and professional character.\nWordmark|Expressive typography connects the name with industrial expertise.\nTypeface|Forward-leaning forms reinforce a sense of progress and confidence.\nGear|The mechanical symbol connects the identity to the industry.","pts":[{"i":0,"x":0.1,"y":0.47,"ly":20,"s":"l"},{"i":1,"x":0.3,"y":0.27,"ly":135,"s":"l"},{"i":2,"x":0.17,"y":0.56,"ly":250,"s":"l"},{"i":3,"x":0.55,"y":0.47,"ly":20,"s":"r"},{"i":4,"x":0.66,"y":0.38,"ly":135,"s":"r"},{"i":5,"x":0.85,"y":0.82,"ly":250,"s":"r"}]}},{"title":"Main Version","text":"The primary logo combines expressive geometry with a deep blue palette. This approach reinforces the company’s professional character and supports a wide range of applications, from documentation to large-scale signage. Alternative versions provide flexibility while maintaining brand recognition.","media":[{"type":"image","src":"tm-logo-main.webp","ratio":"2000/700"}]},{"title":"Brandbook","text":"I approached the brandbook not simply as a set of technical guidelines, but as a system reflecting the company’s identity and principles. After studying the business, I independently defined the structure and content of its sections, established visual principles, and developed the rules for consistent brand application. The result became a foundation for the continued development of the corporate identity.","media":[{"type":"image","src":"tm-brandbook.webp","ratio":"900/15496","doc":true}]},{"title":"Posters","text":"I developed the poster series around the company’s key strengths identified during my initial study. Each message communicates a different aspect of its manufacturing expertise: precision, tailored solutions, engineering capabilities, or quality control. A unified visual system turns individual posts into a consistent brand narrative.","car":true,"media":[{"type":"image","src":"tm-poster-1.webp","ratio":"1122/1402","group":"Project","title":"Precision in Every Part","idea":"Precision builds confidence in manufacturing. The visual emphasizes quality and attention to every detail.","placement":"Social post · 4:5"},{"type":"image","src":"tm-poster-2.webp","ratio":"1122/1402","group":"Project","title":"Parts That Drive Production","idea":"A focus on reliable components that support consistent equipment performance.","placement":"Social post · 4:5"},{"type":"image","src":"tm-poster-3.webp","ratio":"1122/1402","group":"Project","title":"A Reliable Partner","idea":"The communication positions the company as a dependable long-term manufacturing partner.","placement":"Social post · 4:5"},{"type":"image","src":"tm-poster-4.webp","ratio":"1122/1402","group":"Project","title":"From Drawing to Finished Part","idea":"The central idea is turning a client’s technical requirements into a finished product.","placement":"Social post · 4:5","pv":true},{"type":"image","src":"tm-poster-5.webp","ratio":"1122/1402","group":"Project","title":"Milling to Customer Drawings","idea":"Highlights tailored manufacturing based on each client’s technical drawings.","placement":"Social post · 4:5","pv":true},{"type":"image","src":"tm-poster-6.webp","ratio":"1122/1402","group":"Project","title":"An Engineering Approach","idea":"Communicates the engineering expertise behind the manufacturing process.","placement":"Social post · 4:5"},{"type":"image","src":"tm-poster-7.webp","ratio":"1122/1402","group":"Project","title":"Your Ideas in Real Parts","idea":"Connects collaboration with the practical realization of engineering ideas.","placement":"Social post · 4:5"},{"type":"image","src":"tm-poster-8.webp","ratio":"1122/1402","group":"Project","title":"From Idea to Finished Part","idea":"From initial concept to finished component — a complete manufacturing story.","placement":"Social post · 4:5"}],"gal":true},{"title":"Corporate Style","text":"I extended the identity across corporate applications, including workwear, vehicles, outdoor advertising, and business stationery. The goal was to maintain visual consistency across different formats and ensure that every brand touchpoint reinforces the company’s professional image.","media":[{"type":"image","src":"tm-style.webp","ratio":"935/5276","doc":true}]}],"myrole":"Company Research\nBrand Concept\nLogo Design\nBrandbook Strategy & Development\nCorporate Identity\nVisual Communication"}],"cover":{"type":"image","src":"tm-cover.webp","ratio":"2000/1031"},"single":true,"markets":["ru"]},{"slug":"milkkalina","title":"MilkKalina","kind":"design","tone":["#6a1fa8","#2a0a4a"],"desc":"MilkKalina is a self-initiated premium dairy brand concept created for the Polish market. The identity combines associations with natural freshness and traditional farm products with a contemporary visual aesthetic. From the logo to packaging for six products, the project establishes a cohesive brand language built around warmth, personality, and recognition.","role":"Art Direction · Brand Identity · Packaging Design · Visual Communication","category":"Premium dairy products","year":"","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"brand-identity","title":"MilkKalina","sub":"Premium Dairy Brand","cardDesc":"A self-initiated premium dairy brand concept. Identity and packaging design for six products, united by expressive graphics, natural aesthetics, and a cohesive visual language.","desc":"MilkKalina is a self-initiated premium dairy brand concept created for the Polish market. The identity combines associations with natural freshness and traditional farm products with a contemporary visual aesthetic. From the logo to packaging for six products, the project establishes a cohesive brand language built around warmth, personality, and recognition.","role":"Art Direction · Brand Identity · Packaging Design · Visual Communication","industry":"Premium dairy products","deliverables":"Logo, packaging for six products, collection poster","img":{},"chapters":[{"title":"Overview","text":"The challenge was to create a dairy brand that stands apart from conventional category aesthetics while maintaining a sense of freshness and trust. I combined soft typography, a distinctive purple palette, and expressive milk-inspired graphics. The resulting system gives each product its own personality while connecting the entire collection under one identity.","media":[{"type":"image","src":"mk-collection-2.webp","ratio":"1400/1928"}],"gal":true},{"title":"The Logo","text":"The logo combines a friendly cow illustration, fluid lettering, and an expressive graphic form. The dynamic silhouette brings personality to the brand, while soft curves create a natural and approachable feel. Purple establishes a distinctive visual identity, setting MilkKalina apart from traditional dairy packaging.","media":[],"anno":{"img":{"src":"mk-logo-full.webp","ratio":"1600/1139"},"symbols":"Cow|The dynamic cow illustration communicates natural appeal, lightness, and a friendly personality.\nWordmark|Fluid lettering gives the name personality and emotional appeal.\nSplash|The milk-splash shape connects the signature color with a sense of freshness.\nGlow|Soft tonal transitions create depth and enhance the symbol’s visual impact.","pts":[{"i":0,"x":0.43,"y":0.24,"ly":20,"s":"l"},{"i":1,"x":0.59,"y":0.68,"ly":250,"s":"l"},{"i":2,"x":0.93,"y":0.3,"ly":20,"s":"r"},{"i":3,"x":0.62,"y":0.52,"ly":135,"s":"r"}]},"parts":[{"src":"mk-part-cow.webp","ratio":"1200/563","title":"The Cow","text":"A standalone symbol establishing the brand’s friendly personality and connection to dairy products."},{"src":"mk-part-word.webp","ratio":"1200/373","title":"The Name","text":"Custom-style lettering gives the brand a recognizable and distinctive identity."},{"src":"mk-part-splash.webp","ratio":"1200/855","title":"The Splash","text":"A versatile graphic element connecting packaging and visual communications."}]},{"title":"Milk","text":"For the core product, I chose a clean and restrained visual approach. A transparent glass bottle and minimal label keep the focus on the milk itself, while recognizable brand elements create consistency. This direction emphasizes product simplicity and reinforces the brand’s premium positioning.","media":[{"type":"image","src":"mk-milk.webp","ratio":"1086/1448"}],"gal":true},{"title":"Kefir","text":"The kefir packaging extends the visual language established for milk, maintaining a consistent bottle format and brand identity. Subtle color accents and clear information hierarchy help differentiate the products. The goal was to create a cohesive range where each item remains easy to identify without losing its individual character.","media":[{"type":"image","src":"mk-kefir-2.webp","ratio":"1400/1875"}],"gal":true},{"title":"Yogurt","text":"The yogurt packaging places greater emphasis on flavor and emotional appeal. A combination of signature graphics, fluid milk-inspired forms, and berry imagery creates a more expressive identity within the collection. This approach distinguishes the dessert category while maintaining clear brand recognition.","media":[{"type":"image","src":"mk-yogurt.webp","ratio":"1122/1402"}],"gal":true},{"title":"Sour Cream","text":"The design focuses on softness and the rich texture associated with the product. Fluid graphic elements and a light composition communicate a gentle, natural impression. Consistent brand elements connect the packaging to the wider collection while maintaining its own appetizing character.","media":[{"type":"image","src":"mk-sourcream-2.webp","ratio":"1086/1448"}],"gal":true},{"title":"Butter","text":"For butter, I developed a more restrained composition that puts the product at the center of attention. A soft palette and subtle graphics communicate a sense of creaminess and quality. The challenge was to adapt the visual identity to a different packaging format without losing brand consistency.","media":[{"type":"image","src":"mk-butter-2.webp","ratio":"1086/1448"}],"gal":true},{"title":"Cottage Cheese","text":"The cottage cheese packaging introduces a different format built around openness and natural appeal. A transparent section reveals the product’s texture, helping build visual trust. Consistent typography and brand graphics maintain a strong connection to the collection, demonstrating the flexibility of the identity system.","media":[{"type":"image","src":"mk-cottage.webp","ratio":"1122/1402"}],"gal":true}],"myrole":"Art direction\nBrand identity\nPackaging design for six products\nVisual communication"}],"single":true,"cover":{"type":"image","src":"mk-cover-2.webp","ratio":"2200/1228"},"markets":["pl"]},{"slug":"the-hood","title":"THE HOOD","kind":"design","tone":["#3a3a40","#0d0d10"],"desc":"THE HOOD is a limited-edition streetwear concept where clothing becomes a form of self-expression. Built around distinctive silhouettes, original artwork, and carefully considered details, the identity extends beyond the garment itself. Every element, from the emblem to the collectible packaging, contributes to a cohesive brand experience.","role":"Art Direction · Brand Identity · Key Visuals · Packaging Design","category":"Streetwear","year":"","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"brand-identity","title":"THE HOOD","sub":"Limited Edition Streetwear Brand","cardDesc":"THE HOOD is a limited-edition streetwear concept where clothing becomes a form of self-expression.","desc":"THE HOOD is a limited-edition streetwear concept where clothing becomes a form of self-expression. Built around distinctive silhouettes, original artwork, and carefully considered details, the identity extends beyond the garment itself. Every element, from the emblem to the collectible packaging, contributes to a cohesive brand experience.","role":"Art Direction · Brand Identity · Key Visuals · Packaging Design","industry":"Streetwear","deliverables":"Logo, key visuals, lookbook, hardware and details, gift box, pouch","img":{},"chapters":[{"title":"Overview","text":"The challenge was to create more than a clothing design — to establish a brand with a distinct point of view. I brought together contemporary streetwear, functional design, and expressive artwork. Instead of relying on oversized logos, the concept puts individuality, craftsmanship-inspired details, and exclusivity at its core.","media":[{"type":"image","src":"hd-overview.webp","ratio":"1400/1875"}],"gal":true},{"title":"The Logo","text":"The identity is built around a hooded figure — a symbol of independence and individuality. The concealed face leaves room for personal interpretation, while contrasting typography balances restraint with a strong presence. The emblem was designed to remain recognizable even in its smallest applications.","media":[],"anno":{"img":{"src":"hd-logo-full.webp","ratio":"2276/742"},"symbols":"Hood|The hood defines the brand’s distinctive character.\nFace|The concealed face represents personal freedom.\nTHE|Light typography creates visual contrast.\nHOOD|Bold lettering gives the name its presence.\nLine|The tagline reinforces the limited-edition concept.","pts":[{"i":0,"x":0.13,"y":0.06,"ly":20,"s":"l"},{"i":1,"x":0.135,"y":0.8,"ly":250,"s":"l"},{"i":2,"x":0.36,"y":0.2,"ly":20,"s":"r"},{"i":3,"x":0.8,"y":0.42,"ly":135,"s":"r"},{"i":4,"x":0.84,"y":0.93,"ly":250,"s":"r"}]},"parts":[{"src":"hd-part-hood.webp","ratio":"634/709","title":"The hood","text":"A standalone symbol expressing the brand’s attitude."},{"src":"hd-part-word.webp","ratio":"1666/456","title":"The name","text":"Contrasting typography balances restraint and strength."},{"src":"hd-part-line.webp","ratio":"931/100","title":"The line","text":"A concise expression of the limited-edition philosophy."}]},{"title":"Key Visual","text":"The visual direction explores individuality and the freedom to move beyond convention. The contrast between a vast environment and a solitary figure reinforces the brand’s independent spirit. Original artwork becomes the garment’s defining feature, allowing the product to communicate without excessive branding.","media":[{"type":"image","src":"hd-cover.webp","ratio":"2200/1228"}],"gal":true},{"title":"Lookbook","text":"The collection brings together utilitarian construction and expressive artwork. Technical details shape a contemporary silhouette, while ornamental compositions give each piece a distinct identity. The guiding principle is simple: let the design itself make the statement rather than relying on prominent logos.","media":[{"type":"image","src":"hd-lookbook.webp","ratio":"1400/1867"}],"gal":true},{"title":"Details","text":"A premium impression is built through attention, not excess. Fabric textures, considered finishes, branded hardware, and subtle labels create a consistent visual language. These details reward closer inspection and make the garment recognizable without overwhelming its design.","media":[{"type":"image","src":"hd-details.webp","ratio":"1400/1867"}],"gal":true},{"title":"Utility Hardware","text":"Functional components become an extension of the brand identity. Industrial-inspired hardware reinforces the garment’s character, while the engraved emblem acts as a subtle signature. Even the smallest detail is treated as part of the overall concept, rather than decoration for its own sake.","media":[{"type":"image","src":"hd-hardware.webp","ratio":"1400/1875"}],"gal":true},{"title":"Packaging","text":"The packaging is conceived as an extension of the limited-edition experience. Individual numbering, carefully arranged components, and a considered opening sequence turn unboxing into a meaningful moment. Dark materials and burgundy accents reinforce the collection’s exclusive character.","media":[{"type":"image","src":"hd-box.webp","ratio":"2000/1493"}],"gal":true},{"title":"Pouch","text":"Additional accessories extend the brand experience beyond the garment. Designed as a reusable everyday item, the pouch carries the same material language, understated branding, and functional approach. It allows the identity to remain present long after the initial unboxing.","media":[{"type":"image","src":"hd-pouch.webp","ratio":"1536/1024"}],"gal":true}],"myrole":"Art direction\nBrand identity\nKey visuals and lookbook\nHardware and packaging design"}],"single":true,"cover":{"type":"image","src":"hd-cover.webp","ratio":"2200/1228"}},{"slug":"bear-kids-wear","title":"Bear Kids Wear","kind":"design","tone":["#8a5a3b","#5a3822"],"desc":"Bear Kids Wear is a children’s clothing brand identity inspired by warmth, care, and little everyday adventures. Built around a friendly character, a nature-inspired palette, and a gentle visual language, the identity connects clothing, branded details, and communication materials into a cohesive brand experience.","role":"Brand identity · Key visuals · Print","category":"Kids fashion","year":"2026","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"brand-identity","title":"Bear Kids Wear","sub":"Brand identity and key visuals","cardDesc":"A children’s clothing brand identity combining a friendly character, a nature-inspired palette, and emotionally engaging visual communication. From brand elements and garment details to campaigns and print applications.","desc":"Bear Kids Wear is a children’s clothing brand identity inspired by warmth, care, and little everyday adventures. Built around a friendly character, a nature-inspired palette, and a gentle visual language, the identity connects clothing, branded details, and communication materials into a cohesive brand experience.","role":"Brand identity · Key visuals · Print","industry":"Kids fashion","deliverables":"Brand board, patterns, labels and details, key visuals, print pieces","img":{},"chapters":[{"title":"Overview","text":"The challenge was to create a children’s clothing identity that feels emotionally engaging while remaining contemporary and refined. Rather than relying on bright contrasts and overly playful graphics, I focused on soft natural colors, simple shapes, and a friendly bear character. This approach creates a visual language that appeals to both children and parents, balancing comfort with modern aesthetics.","media":[{"type":"image","src":"bk-board.webp","ratio":"1122/1402"}]},{"title":"The Logo","text":"The logo is built around a friendly bear integrated into the brand name. Simple lines and rounded forms create an approachable personality without feeling overly cartoonish. The symbol serves as an emotional signature that adapts naturally across garments, labels, packaging, and digital communication.","media":[],"anno":{"img":{"src":"bk-logo-cream.webp","ratio":"1063/965"},"symbols":"Tuft|A small detail gives the character individuality and playful charm.\nEyes|Minimal facial features create a friendly and approachable character.\nNose|The rounded shape reinforces the logo’s soft visual language.\nOne line|A continuous outline connects the character and name into one cohesive mark.\nWordmark|Soft, rounded lettering makes the brand recognizable and approachable.\nTagline|The supporting tagline clearly communicates the brand’s category.","pts":[{"i":0,"x":0.25,"y":0.04,"ly":20,"s":"l"},{"i":1,"x":0.17,"y":0.2,"ly":135,"s":"l"},{"i":2,"x":0.19,"y":0.33,"ly":250,"s":"l"},{"i":3,"x":0.46,"y":0.32,"ly":20,"s":"r"},{"i":4,"x":0.55,"y":0.7,"ly":135,"s":"r"},{"i":5,"x":0.62,"y":0.93,"ly":250,"s":"r"}]}},{"title":"Color","text":"The color palette draws inspiration from nature, warmth, and calmness. Soft browns and cream tones establish the brand’s foundation, while muted sage and blue provide flexibility for different collections. The result is a recognizable palette that supports variety without visual overload.","palette":"#7A5236|Warm brown\n#FDF8F1|Cream\n#E8D7C4|Sand\n#A7B698|Sage\n#8DA7C4|Denim","media":[]},{"title":"Patterns","text":"The patterns extend the brand’s personality through small symbols associated with childhood, nature, and kindness. They introduce an additional layer of recognition beyond the primary logo. Different pattern densities allow the system to adapt across textiles, packaging, and supporting brand applications.","grid":true,"media":[{"type":"image","src":"bk-pattern-1.webp","ratio":"1254/1254"},{"type":"image","src":"bk-pattern-2.webp","ratio":"1254/1254"}]},{"title":"Labels and Details","text":"A brand identity should be experienced through the product itself, not only through advertising. Special attention was given to woven labels, embroidery, patches, and branded hardware. Subtle branding preserves the clothing’s understated aesthetic, while consistent details establish recognition across the collection.","media":[{"type":"image","src":"bk-labels.webp","ratio":"1122/1402"}]},{"title":"Key Visuals","text":"The visual communication celebrates everyday childhood moments — playing, exploring, feeling comfortable, and being cared for. Warm atmospheres and calm compositions create an emotional connection with the audience. Rather than relying on aggressive advertising, the brand communicates a lifestyle and a feeling that parents can relate to.","car":true,"media":[{"type":"image","src":"bk-ad-1.webp","ratio":"1122/1402","group":"Project","title":"Little Comforts","idea":"Comfort as part of a happy childhood. The visual communicates warmth and the freedom to be yourself.","placement":"Key visual · 4:5"},{"type":"image","src":"bk-ad-2.webp","ratio":"1122/1402","group":"Project","title":"Cozy Knits","idea":"A focus on texture and warmth, where clothing details contribute to the brand’s emotional appeal.","placement":"Key visual · 4:5"},{"type":"image","src":"bk-ad-3.webp","ratio":"1122/1402","group":"Project","title":"Playful Details","idea":"Care lives in the details. Thoughtful branding turns an everyday purchase into a more personal experience.","placement":"Key visual · 4:5"},{"type":"image","src":"bk-ad-4.webp","ratio":"1122/1402","group":"Project","title":"Everyday Moments","idea":"The brand becomes part of everyday discoveries, with clothing that feels naturally connected to childhood.","placement":"Key visual · 4:5"},{"type":"image","src":"bk-ad-5.webp","ratio":"1122/1402","group":"Project","title":"Tiny Bear Collection","idea":"A cohesive collection built around soft forms, everyday comfort, and recognizable details.","placement":"Key visual · 4:5"},{"type":"image","src":"bk-ad-6.webp","ratio":"1122/1402","group":"Project","title":"Little Wardrobe","idea":"The visual identity extends across everyday wardrobe essentials, connecting different pieces through one recognizable character.","placement":"Key visual · 4:5"}],"gal":true},{"title":"Digital and Print","text":"The identity extends across customer touchpoints, from social media and product cards to care guides and packaging inserts. Each application serves a specific purpose while maintaining the same visual character. This creates a consistent brand experience throughout discovery, consideration, and purchase.","car":true,"media":[{"type":"image","src":"bk-story.webp","ratio":"941/1672","group":"Project","title":"Story","idea":"An emotional introduction to the brand that connects its personality with collection discovery.","placement":"Social · 9:16"},{"type":"image","src":"bk-product-2.webp","ratio":"896/1200","group":"Project","title":"Product Card","idea":"The identity adapts to online shopping, balancing brand atmosphere with clear product information.","placement":"Online shop"},{"type":"image","src":"bk-care.webp","ratio":"1122/1402","group":"Project","title":"Care with Love","idea":"A care guide that extends the brand’s philosophy, making practical information part of the experience.","placement":"Print · Insert"},{"type":"image","src":"bk-thanks.webp","ratio":"1122/1402","group":"Project","title":"Thank-you Card","idea":"A thoughtful packaging detail that adds warmth to the purchase experience and strengthens emotional connection.","placement":"Print · Card"},{"type":"image","src":"bk-stickers.webp","ratio":"1122/1402","group":"Project","title":"Sticker Sheet","idea":"Supporting graphics turn brand symbols into standalone elements that extend beyond clothing.","placement":"Print · Stickers"}],"gal":true}],"myrole":"Brand board and color system\nPatterns and icons\nKey visuals and print pieces"}],"single":true,"cover":{"type":"image","src":"bk-cover-3.webp","ratio":"1672/941"},"markets":["eu"]},{"slug":"beedrill","title":"BEEDRILL","kind":"design","tone":["#FEB500","#EF7F1A"],"desc":"BEEDRILL is a logo and visual identity project for a professional power tools brand. The concept brings together energy, precision, and movement in a distinctive symbol where a bee transforms into a drill bit. Built around bold graphics and a high-contrast palette, the identity creates a recognizable character across tools, workwear, and brand applications.","role":"Logo · Brand identity · Merch","category":"Power tools","year":"2026","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"brand-identity","title":"BEEDRILL","sub":"Logo and brand identity","cardDesc":"BEEDRILL is a visual identity for a professional power tools brand. A distinctive symbol combining a bee and a drill bit becomes the foundation for a cohesive system across products and brand applications.","desc":"BEEDRILL is a logo and visual identity project for a professional power tools brand. The concept brings together energy, precision, and movement in a distinctive symbol where a bee transforms into a drill bit. Built around bold graphics and a high-contrast palette, the identity creates a recognizable character across tools, workwear, and brand applications.","role":"Logo · Brand identity · Merch","industry":"Power tools","deliverables":"Logo and variants, brand board, workwear, product visuals","img":{},"chapters":[{"title":"Overview","text":"The challenge was to create a distinctive identity in the competitive power tools category. Instead of relying on conventional technical symbols, I explored the bee as a metaphor for energy, speed, and purposeful work. By combining its form with a drill bit, I developed a mark that directly connects to the BEEDRILL name and establishes a memorable brand personality.","media":[{"type":"image","src":"bd-board.webp","ratio":"1381/1139"}]},{"title":"The Logo","text":"The logo brings two ideas together — a bee and a drill bit. Its expressive silhouette communicates energy and movement, while the transformation of the insect’s body into a tool creates an immediate connection to the product category. Bold geometric typography balances the detailed symbol, forming a cohesive and recognizable identity.","media":[],"anno":{"img":{"src":"bd-logo-white.webp","ratio":"2029/970"},"symbols":"Head|The expressive character communicates energy and confidence.\nStripes|Signature stripes connect the natural symbol with industrial aesthetics.\nDrill Body|Transforming the bee’s body into a drill bit connects the brand name with its purpose.\nWings|Dynamic wing shapes reinforce a sense of speed and motion.\nWordmark|Bold geometric lettering communicates strength and supports recognition.\nTagline|The tagline establishes the brand’s professional positioning.","pts":[{"i":0,"x":0.14,"y":0.4,"ly":20,"s":"l"},{"i":1,"x":0.22,"y":0.57,"ly":135,"s":"l"},{"i":2,"x":0.14,"y":0.8,"ly":250,"s":"l"},{"i":3,"x":0.33,"y":0.17,"ly":20,"s":"r"},{"i":4,"x":0.62,"y":0.6,"ly":135,"s":"r"},{"i":5,"x":0.8,"y":0.88,"ly":250,"s":"r"}]}},{"title":"Logo Versions","text":"The logo was developed as a flexible part of the visual identity system. The full-color version expresses the brand’s character, while monochrome and high-contrast alternatives allow the mark to adapt to different materials and surfaces. This approach helps maintain recognition across a wide range of applications.","media":[{"type":"image","src":"bd-logo-versions.webp","ratio":"2000/1080"}]},{"title":"Color","text":"The palette is built around black and vibrant yellow-orange tones. This combination references both the bee and the industrial environment, creating a strong visual connection between the brand name and its category. High contrast increases visibility, while neutral supporting colors provide flexibility across different applications.","palette":"#1C1B17|Black\n#FEB500|Amber\n#FCC204|Yellow\n#EF7F1A|Orange\n#D9DADA|Light grey\n#FEFEFE|White","media":[]},{"title":"Workwear","text":"The identity extends into professional and everyday apparel. The aim was to maintain brand recognition while respecting the functional character of the garments. Restrained logo placement and carefully integrated accent colors create a cohesive brand presence beyond the tools themselves.","media":[{"type":"image","src":"bd-hoodie.webp","ratio":"1448/1086"},{"type":"image","src":"bd-jacket.webp","ratio":"1312/1199"}]},{"title":"Product Visuals","text":"Conceptual product visuals demonstrate how the identity could extend into a range of power tools. Brand colors and graphics are integrated into the product housings, while technical-style presentations reinforce the professional positioning. This shows how the visual system can develop from a standalone logo into a cohesive product family.","car":true,"media":[{"type":"image","src":"bd-drill.webp","ratio":"2000/1493","group":"Project","title":"Cordless Drill Driver","idea":"The conceptual visualization explores the identity within industrial product design. An exploded-view composition reinforces the technical character of the tool and presents it as part of the BEEDRILL product family.","placement":"Concept render"},{"type":"image","src":"bd-hammer.webp","ratio":"2000/1493","group":"Project","title":"Rotary Hammer","idea":"An extension of the product identity into another tool category. Consistent graphics, colors, and logo placement establish a recognizable family while preserving the character of each product.","placement":"Concept render"}]}],"myrole":"Logo Design\nVisual Concept\nBrand Identity\nColor System\nBranded Applications\nConceptual Product Visuals"}],"single":true,"cover":{"type":"image","src":"bd-cover-2.webp","ratio":"1672/941"},"markets":["us"]},{"slug":"exzap","title":"Exzap","kind":"design","tone":["#FFE14D","#F5C400"],"desc":"Exzap is an online store of auto parts and oils in Tashkent: over 10,000 products for cars and trucks, with delivery across Uzbekistan. Its range includes Valesco oils and filters and Shell lubricants; this case covers print and marketing work for both brands.","role":"Print · Brand marketing","category":"Auto parts · Lubricants","year":"","brief":"","idea":"","result":"","media":[{"type":"image","src":"exzap-shell-brochure.webp","ratio":"2000/1416","group":"Creatives","title":"Shell brochure","idea":"An infographic brochure sheet for the Shell range: Rimula heavy-duty diesel oils, Helix Ultra Professional and the exclusive partnership with equipment makers (OEM).","placement":"Print · Brochure"},{"type":"image","src":"exzap-shell-mockup.webp","ratio":"1800/1350","group":"Creatives","title":"Shell brochure: cover and spread","idea":"The brochure as a folded print piece: a red cover with the Shell pecten and a QR code, and the opened spread beside it.","placement":"Print · Mockup"},{"type":"video","src":"v-valesco-eurotec.mp4","poster":"v-valesco-eurotec.jpg","ratio":"720/900","group":"Creatives","title":"Valesco Eurotec 5W-30: product animation","idea":"A metal can with the red Valesco ribbon above glowing lava, built as a short loop for social media.","pl st of tools: outdoor ads, official points of sale, coupons, bundles, seminars, collaborations.","placement":"Page 12 of 12"}]}]}],"cover":{"type":"image","src":"exzap-cover-2.webp","ratio":"1672/941"},"markets":["uz"]},{"slug":"yustex","title":"Yustex","kind":"design","tone":["#FFE14D","#F5C400"],"desc":"YUSTEX is a logo and visual identity project for a textile manufacturer based in Uzbekistan. The concept connects the natural origins of textile materials with the precision of modern manufacturing. Built around a geometric cotton-inspired symbol, clean typography, and a flexible graphic system, the identity establishes a recognizable and professional brand image.","role":"Logo · Identity · Motion","category":"Textile","year":"","brief":"","idea":"","result":"","media":[],"subs":[{"slug":"identity","title":"Yustex","sub":"Logo breakdown","cardDesc":"A textile manufacturer’s identity combining cotton-inspired symbolism with modern geometry. Logo design, color system, graphic patterns, and motion identity.","desc":"YUSTEX is a logo and visual identity project for a textile manufacturer based in Uzbekistan. The concept connects the natural origins of textile materials with the precision of modern manufacturing. Built around a geometric cotton-inspired symbol, clean typography, and a flexible graphic system, the identity establishes a recognizable and professional brand image.","role":"Logo · Identity · Motion","industry":"Textile","deliverables":"Logo, color palette, patterns, merch mockups, logo animation","img":{},"card":{"type":"image","src":"yustex-identity-card.webp","ratio":"2000/1036"},"chapters":[{"title":"Overview","text":"The challenge was to create an identity that reflects the textile industry while communicating a modern and professional character. I chose cotton as the central reference and translated its natural form into a precise geometric symbol. This approach connects the origin of the material, manufacturing precision, and brand recognition within one cohesive concept.","media":[{"type":"image","src":"yustex-logo-h.webp","ratio":"2000/559"}]},{"title":"The Logo","text":"The symbol is inspired by a cotton boll, simplified into three geometric elements. Together, they form a unified mark that balances the softness of a natural material with the precision of industrial design. Clean typography reinforces the brand’s contemporary character, allowing the identity to remain recognizable across different scales and applications.","anno":{"img":{"src":"yustex-logo-white.webp","ratio":"758/430"},"symbols":"Cotton Boll|The cotton-inspired symbol connects the identity to the textile industry.\nRounded Facets|Softened geometry balances natural forms with industrial precision.\nWordmark|Clean typography establishes a modern and professional brand character.\nThree Turning Parts|Three connected elements represent continuity and unity within the production process.\nOrange|Orange adds energy and makes the symbol more distinctive.\nNavy and White|The contrasting palette communicates confidence and supports versatile applications.","pts":[{"i":0,"x":0.36,"y":0.3,"ly":20,"s":"l"},{"i":1,"x":0.41,"y":0.07,"ly":135,"s":"l"},{"i":2,"x":0.18,"y":0.86,"ly":250,"s":"l"},{"i":3,"x":0.6,"y":0.14,"ly":20,"s":"r"},{"i":4,"x":0.56,"y":0.5,"ly":135,"s":"r"},{"i":5,"x":0.84,"y":0.86,"ly":250,"s":"r"}]},"media":[]},{"title":"Philosophy","text":"The central idea is to communicate the relationship between natural materials and a structured manufacturing process. Cotton became the starting point, while its geometric interpretation gave the symbol a more universal character. The three connected elements can also represent continuity, collaboration, and unity throughout production.","media":[{"type":"image","src":"yustex-philosophy2.webp","ratio":"2000/1154"}]},{"title":"Color and Pattern","text":"The color system balances professionalism with energy. Deep navy establishes a confident, technical character, while orange adds contrast and visual distinction. Supporting patterns extend the logo’s geometry into a flexible visual language, allowing the identity to remain recognizable without relying on the complete logo in every application.","grid":true,"media":[{"type":"image","src":"yustex-palette2.webp","ratio":"1353/1209"},{"type":"image","src":"yustex-patterns2.webp","ratio":"1400/1727"}]},{"title":"Logo Versions","text":"The identity was developed to work consistently across different environments. High-contrast logo variations maintain recognition on both light and dark backgrounds. This flexibility supports applications in print, digital communication, and corporate branding while preserving a cohesive visual character.","media":[{"type":"image","src":"yustex-variants.webp","ratio":"1504/281"}]},{"title":"Merch","text":"The identity extends into everyday branded objects. The goal was to demonstrate how the visual system could work beyond the logo itself. By combining graphic patterns, color blocks, and the brand symbol, the identity maintains recognition across different materials and formats.","media":[{"type":"image","src":"yustex-merch2.webp","ratio":"2000/2048"}]},{"title":"Logo Animation","text":"The logo animation extends the idea of geometric construction into motion. Individual elements come together to reveal the symbol, reinforcing the brand’s modern and technical character. This creates a natural connection between the static identity and its use in digital communication.","media":[{"type":"video","src":"v-yustex-logo.mp4","poster":"v-yustex-logo.jpg","ratio":"848/464","title":"Yustex logo animation"}]}],"myrole":"Logo design\nColor and patterns\nMerch mockups\nLogo animation"}],"cover":{"type":"image","src":"yustex-cover-2.webp","ratio":"1672/941"},"single":true,"markets":["uz"]},{"slug":"concepts","title":"Concepts","kind":"concept","tone":["#13b6c9","#0a2a6e"],"desc":"Self-initiated posters and concept work: ideas explored outside client briefs.","role":"Concept · Visual · Typography","category":"Self-initiated","year":"","brief":"","idea":"","result":"","media":[{"type":"image","src":"st-471a796d1fcb.webp","ratio":"1792/2400","title":"Design your way","idea":"Familiar pop icons rebuilt bead by bead — “Design your way, make it matter.”","placement":"Concept poster","group":"Creatives"},{"type":"image","src":"st-6c12095149ff.webp","ratio":"1792/2400","title":"Build your resilience","idea":"A translucent wasp crosses the bold headline: strength that looks delicate.","placement":"Concept poster","group":"Creatives"},{"type":"image","src":"concept-vikings.webp","ratio":"1400/1732","group":"Creatives","title":"Vikings","idea":"A skull whose crown holds a Viking longship on a turquoise sea under a starry sky: a surreal poster.","placement":"Concept poster"},{"type":"image","src":"concept-miobrush.webp","ratio":"1400/1986","group":"Creatives","title":"Miobrush: marketplace product card","idea":"A product card for a makeup brush cleaning soap: tropical leaves, the soap tin with brushes, and three short callouts about gentle cleaning, removing any texture and deep cleaning of brushes and sponges.","placement":"Marketplace · Product card"},{"type":"image","src":"yapona-set-discount.webp","ratio":"1300/2311","group":"Creatives","title":"Yapona Mama: Site set: 15% off","idea":"A tall post with a sushi set on a dark plate and chopsticks over a soft Japanese wave pattern: 15% off the set when you order through the site.","placement":"Instagram · Telegram"},{"type":"image","src":"yapona-dont-be-banal.webp","ratio":"1500/2122","group":"Creatives","title":"Yapona Mama: Don’t be banal: sushi instead of flowers","idea":"An 8 March poster: a woman with a megaphone and a bouquet-shaped sushi set, with the headline “Don’t be banal: flowers, sweets, sushi”.","placement":"Poster · Print"},{"type":"image","src":"yapona-8-march-love.webp","ratio":"1500/1500","group":"Creatives","title":"Yapona Mama: 8 March: love is here","idea":"A big pink 8 behind two women and a heart-shaped sushi set, with a gift set for orders over 300,000 sum.","placement":"Poster · Print"},{"type":"image","src":"yapona-mika-love.webp","ratio":"1500/2122","group":"Creatives","title":"Yapona Mama: Mika Love set as a gift","idea":"Two friends making a heart over a heart-shaped sushi set, framed by navy clouds and waves on pink: the Mika Love set is free with a large order.","placement":"Poster · Print"}],"subs":[{"slug":"akira","title":"Akira","sub":"Alcoholic drinks","cardDesc":"Key visual posters for an alcoholic drinks company.","desc":"Concept key visuals for Akira, a company that makes alcoholic drinks: wine, absinthe and sake under one samurai seal.","role":"Concept · Key visual · Posters","industry":"Alcoholic drinks","deliverables":"4 key visual posters","img":{"hero":{"type":"image","src":"st-aa7b45b30f62.webp","ratio":"1672/941"}},"card":{"type":"image","src":"st-aa7b45b30f62.webp","ratio":"1672/941"},"chapters":[{"title":"The posters","text":"Akira is a company that makes alcoholic drinks: wine, absinthe and sake under one samurai seal. Four key visuals give each drink its own character inside one visual world: a chained bottle for the red wine, skulls in the glass for absinthe, a sea serpent for the sake of Okinawa and an oni for the samurai sake.","car":true,"media":[{"type":"image","src":"st-2aea2f9020ad.webp","ratio":"3840/5760","group":"Creatives","title":"Scarlet Spirit — dry red wine","idea":"A chained bottle in a red splash beside a geisha: passion held under control.","placement":"Poster"},{"type":"image","src":"st-cdd833d107fd.webp","ratio":"3840/5760","group":"Creatives","title":"Absent — absinthe","idea":"Green skulls swirling inside the glass: “Open your mind.”","placement":"Poster"},{"type":"image","src":"st-5811da7d4da4.webp","ratio":"1333/1999","group":"Creatives","title":"Habu Sake","idea":"A sea serpent coiled inside the bottle: the spirit of Okinawa.","placement":"Poster"},{"type":"image","src":"st-07de58ea720a.webp","ratio":"1333/1999","group":"Creatives","title":"Sake for the true samurai","idea":"A black bottle with an oni face rising out of it: strength in a single bottle.","placement":"Poster"}],"gal":true}],"myrole":"Concept\nKey visuals\nPosters"},{"slug":"charity-terminals","title":"Charity Terminals","sub":"Terminal branding concept","cardDesc":"Concept wraps and screens for OSON donation terminals: one kiosk, five campaign looks.","desc":"A branding concept for OSON donation terminals: cabinet wraps, screen layouts and campaign graphics for the Musaffo Osmon charity drive and its spin-offs. The concept was presented to OSON but did not go into production.","role":"Terminal branding","industry":"Fintech / Charity","deliverables":"Concept: 5 terminal wraps, screen layouts, campaign marks","img":{"hero":{"type":"image","src":"oson-terminal-lineup.webp","ratio":"2400/1324"}},"card":{"type":"image","src":"oson-terminal-card.webp","ratio":"2000/1036"},"chapters":[{"title":"Overview","text":"One kiosk, five looks, explored as a concept. Each wrap turns the same donation terminal into a campaign: the screen shows the amounts and payment options, the cabinet tells the story, and a glass window lets people watch the donations grow.","media":[{"type":"image","src":"oson-terminal-lineup.webp","ratio":"2400/1324"}]},{"title":"Musaffo Osmon","text":"“Clear sky” — the main campaign. A deep navy cabinet with a sky-blue wave, the campaign mark of two hands holding a cloud, and a screen with quick amounts and a tree that grows with every donation.","media":[{"type":"image","src":"oson-terminal-wave.webp","ratio":"1200/1800"}]},{"title":"Geometric sky","text":"A second direction built from simple shapes: clouds and circles cut into blue and white blocks, so the cabinet reads as a pattern from across the hall while the OSON block stays clear at the base.","grid":true,"media":[{"type":"image","src":"oson-terminal-sky.webp","ratio":"1200/1800"},{"type":"image","src":"oson-terminal-circles.webp","ratio":"1200/1800"}]},{"title":"Go Green","text":"The same geometry recoloured in greens for an environmental drive, with a sprout in place of the cloud.","media":[{"type":"image","src":"oson-terminal-green.webp","ratio":"1200/1800"}]},{"title":"For children","text":"A light, hand-drawn edition for a children’s health campaign: rainbows, clouds and stars on white, a cheerful kid in a wheelchair, and a doctor with a child on the screen.","media":[{"type":"image","src":"oson-terminal-kids.webp","ratio":"1200/1800"}]}],"myrole":"Concept\nTerminal wrap design\nCampaign marks and graphics\nScreen layouts\n3D visualisation"}],"cover":{"type":"image","src":"concepts-cover.webp","ratio":"1672/941"}}]}</script>

function carUi(){var tr=$('.track',main);if(!tr)return;var n=$$('.slide',tr).length;$('.car-count',main).textContent=pad(carIdx+1)+' / '+pad(n);var b=$$('[data-car]',main);b[0].disabled=carIdx===0;b[1].disabled=carIdx>=n-1;}

/* ---------- shutter ---------- */
var SH={N:9,p:0,cx:0,cy:0,Rc:0,rOpen:0,blades:[]};
function shBuild(vw,vh){
  var N=SH.N,cx=vw/2,cy=vh/2,Rc=Math.min(vw,vh)*(mqNarrow.matches?.44:.38),W=Rc*1.3,H=Rc*2.3,rr=Rc+70;
  SH.cx=cx;SH.cy=cy;SH.Rc=Rc;SH.rOpen=Rc/Math.cos(Math.PI/N)+24;SH.p=0;
  var s=Rc/rr,bl='';
  for(var i=0;i<N;i++)bl+='<g class="bl"><rect x="'+(-W)+'" y="0" width="'+(2*W)+'" height="18" fill="url(#sh-sd)"/><rect x="'+(-W)+'" y="18" width="'+(2*W)+'" height="'+H+'" fill="url(#sh-bd)"/><line x1="'+(-W)+'" y1="18" x2="'+W+'" y2="18" stroke="#D3D8DE" stroke-width="1"/></g>';
  sh.setAttribute('viewBox','0 0 '+vw+' '+vh);
  sh.innerHTML='<defs><clipPath id="sh-ap"><circle cx="'+cx+'" cy="'+cy+'" r="'+Rc+'"/></clipPath>'
   +'<linearGradient id="sh-bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3E7EC"/><stop offset=".012" stop-color="#FAFBFC"/><stop offset=".25" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient>'
   +'<linearGradient id="sh-sd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1724" stop-opacity="0"/><stop offset="1" stop-color="#0F1724" stop-opacity=".16"/></linearGradient>'
   +'<radialGradient id="sh-rim" gradientUnits="userSpaceOnUse" cx="'+cx+'" cy="'+cy+'" r="'+rr+'"><stop offset="'+(s-.001)+'" stop-color="#000" stop-opacity="0"/><stop offset="'+s+'" stop-color="#0F1724" stop-opacity=".12"/><stop offset="1" stop-color="#0F1724" stop-opacity="0"/></radialGradient></defs>'
   +'<path fill="var(--plate)" fill-rule="evenodd" d="M0 0H'+vw+'V'+vh+'H0Z M'+(cx-Rc)+' '+cy+'a'+Rc+' '+Rc+' 0 1 0 '+(2*Rc)+' 0a'+Rc+' '+Rc+' 0 1 0 '+(-2*Rc)+' 0Z"/>'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="url(#sh-rim)"/>'
   +'<g clip-path="url(#sh-ap)"><g transform="translate('+cx+' '+cy+')">'+bl+'</g></g>'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(Rc+7)+'" fill="none" stroke="#FFFFFF" stroke-width="14"/>'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="'+Rc+'" fill="none" stroke="#0F1724" stroke-opacity=".10" stroke-width="1.2"/>'
   +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(Rc+14)+'" fill="none" stroke="#E6E8EB" stroke-width="1"/>';
  SH.blades=$$('.bl',sh);shSet(0);sh.style.display='block';sh.style.opacity=0;
}
function shSet(p){SH.p=p;var r=SH.rOpen+(-6-SH.rOpen)*p,tw=p*46,W=SH.Rc*1.3,x0=r>0?-r*Math.tan(Math.PI/SH.N)-4:-W,wd=W-x0;for(var i=0;i<SH.blades.length;i++){var g=SH.blades[i];g.setAttribute('transform','rotate('+(i*360/SH.N+tw)+') translate(0 '+(r-18)+')');for(var c=g.firstChild;c;c=c.nextSibling){if(c.tagName==='line')c.setAttribute('x1',x0);else{c.setAttribute('x',x0);c.setAttribute('width',wd);}}}}
function shRun(to,dur){var from=SH.p;return tween(dur,function(e){shSet(from+(to-from)*e);});}
function shShow(d){var a=sh.animate([{opacity:0,transform:'scale(1.12)'},{opacity:1,transform:'scale(1)'}],{duration:d,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});return a.finished.catch(function(){});}
function shHide(d){var a=sh.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.14)'}],{duration:d,easing:'ease-in',fill:'forwards'});return a.finished.catch(function(){});}
function shReset(){sh.getAnimations().forEach(function(a){a.cancel();});sh.style.display='none';sh.innerHTML='';SH.blades=[];vReset();}
/* shutter render: the artist's frames embedded in the page (WebP with alpha) and played on a canvas: no video player, codecs or external files, so it works in every browser; code shutter is only a fallback if frames fail */
var VS={ok:false,dead:false,box:null,cv:null,ctx:null,c:[],o:[],raf:0,fps:35,hi:'4ade9c6ff1966c292226aaa84a0ad18a.json',isHi:false};
function vMk(d){function mk(a){return a.map(function(b){var im=new Image();im.decoding='async';im.src='data:image/webp;base64,'+b;return im;});}var st={w:d.w,h:d.h,c:mk(d.c),o:mk(d.o)},bad=0;return Promise.all(st.c.concat(st.o).map(function(im){return im.complete&&im.naturalWidth?1:new Promise(function(r){im.onload=function(){r(1);};im.onerror=function(){bad++;r(0);};});})).then(function(){if(bad>4)throw new Error('frames');st.c.slice(0,4).forEach(function(im){if(im.decode)im.decode().catch(function(){});});return st;});}
function vUse(st){VS.c=st.c;VS.o=st.o;VS.cv.width=st.w;VS.cv.height=st.h;VS.ctx=VS.cv.getContext('2d');VS.ctx.imageSmoothingEnabled=true;VS.ctx.imageSmoothingQuality='high';}
/* phones: every frame is decoded once, at screen size, so playing the shutter never waits for an image decoder */

function vInit(){VS.box=$('#vshut');VS.cv=$('#vs-canvas');var el=document.getElementById(mqNarrow.matches?'sframesm':'sframes');if(!el){VS.dead=true;return;}var d;try{d=JSON.parse(el.textContent);}catch(e){VS.dead=true;return;}
 vMk(d).then(function(st){vUse(st);VS.ok=true;vHi();},function(){VS.dead=true;});}
/* sharper 2560x1440 frames for high-density desktop screens; the embedded 1920 set stays if this fails */
function vHi(){if(mqNarrow.matches||Math.max(innerWidth,innerHeight*16/9)*(window.devicePixelRatio||1)<=2100||!window.fetch)return;
 fetch(VS.hi).then(function(r){if(!r.ok)throw new Error('hi');return r.json();}).then(vMk).then(function(st){(function swap(){if(busy)return setTimeout(swap,300);vUse(st);VS.isHi=true;})();}).catch(function(){});}
frPet.then(function(){return frLoad(mqNarrow.matches?'sframesm':'sframes');}).then(function(){vInit();});
function fadeSwap(doSwap){return stage.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'}).finished.catch(function(){}).then(function(){doSwap();stage.getAnimations().forEach(function(a){a.cancel();});return stage.animate([{opacity:0},{opacity:1}],{duration:320}).finished.catch(function(){});});}
function vReady(){return VS.ok&&!VS.dead;}
function waitReady(ms){return new Promise(function(res){var t0=performance.now();(function f(){if(vReady()||VS.dead||performance.now()-t0>ms)return res();requestAnimationFrame(f);})();});}
function vSize(vw,vh){var r=VS.box?VS.box.getBoundingClientRect():null;if(r&&r.width&&r.height){vw=r.width;vh=r.height;}var ar=(VS.cv.width||16)/(VS.cv.height||9),k=mqNarrow.matches?1.12:1,w=Math.max(vw*k,vh*k*ar);VS.cv.style.width=w+'px';VS.cv.style.height=(w/ar)+'px';}
function vDraw(im){var x=VS.ctx;x.clearRect(0,0,VS.cv.width,VS.cv.height);if(im&&(im.naturalWidth||im.width)){try{x.drawImage(im,0,0,VS.cv.width,VS.cv.height);}catch(e){}}}
function seqPlay(fr,hook){return new Promise(function(res){var t0=performance.now(),last=-1;function f(now){var i=Math.max(0,Math.floor((now-t0)*VS.fps/1000));if(i>=fr.length){vDraw(fr[fr.length-1]);VS.raf=0;return res();}if(i!==last){last=i;vDraw(fr[i]);if(hook)hook(i);}VS.raf=requestAnimationFrame(f);}f(t0);});}
/* phones: the same shutter, but quick (about 0.6 s to the new page) and the robot simply fades out and back in */
async function videoShutterM(vw,vh,doSwap){
  var f0=VS.fps,bk=false;VS.fps=54;
  VS.box.style.display='block';vSize(vw,vh);vDraw(null);
  var po=+getComputedStyle(petEl).opacity||0;if(po>0)petEl.animate([{opacity:po},{opacity:0}],{duration:150,fill:'forwards'});
  var zo=stage.animate([{transform:'scale(1)'},{transform:'scale(.95)'}],{duration:540,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  await seqPlay(VS.c);
  zo.cancel();doSwap();
  stage.style.transformOrigin='50% '+(vh/2)+'px';
  stage.animate([{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:560,easing:'cubic-bezier(.2,.7,.2,1)'});
  await seqPlay(VS.o,function(i){if(i>=7&&!bk){bk=true;petEl.getAnimations().forEach(function(a){a.cancel();});var to=anchorPose();if(to){setMode(to.mode);place(to.x,to.y,to.k);petEl.style.opacity='1';petEl.animate([{opacity:0},{opacity:1}],{duration:300,easing:'ease-out'});}else petEl.style.opacity='0';}});
  VS.fps=f0;vDraw(null);
}
async function videoShutter(vw,vh,doSwap){
  var f0=VS.fps;if(mqNarrow.matches)VS.fps=46;
  var sc=Math.max(vw/1920,vh/1080),cx=vw/2,cy=vh/2-2.4*sc,jump=null,fly=null;
  VS.box.style.display='block';vSize(vw,vh);vDraw(null);
  var zo=stage.animate([{transform:'scale(1)'},{transform:'scale(.93)'}],{duration:720,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  var toC=function(){return petMove({x:cx,y:cy,k:64*sc/120},{dur:340});};
  var k0=64*sc/120,dive=function(){return toC().then(function(ok){if(!ok)return;return tween(190,function(e){place(cx,cy,k0*(1-.88*e));petEl.style.opacity=String(1-e);canvas.style.opacity=String(1-e);}).then(function(){pts.length=0;canvas.style.opacity='';});});};
  await seqPlay(VS.c,function(i){if(i>=5&&!jump)jump=dive();});
  await (jump||dive());
  zo.cancel();doSwap();
  stage.style.transformOrigin='50% '+(vh/2)+'px';
  stage.animate([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:720,easing:'cubic-bezier(.2,.7,.2,1)'});
  var out=function(){if(PETOFF||!anchorPose())return Promise.resolve();var k1=64*sc/120;place(cx,cy,k1*.12);petEl.style.opacity='0';return tween(170,function(e){place(cx,cy,k1*(.12+.88*e));petEl.style.opacity=String(e);}).then(out2);};
  var out2=function(){var to=anchorPose();if(!to)return Promise.resolve();if(to.mode==='robot'&&LD.ok&&PF){return petMove(to,{dur:400}).then(function(){if(XF.ok&&ANT.ok)playUnfold();else{setMode('robot');playLand();}});}setTimeout(function(){setMode(to.mode);},150);return petMove(to,{dur:400});};
  await seqPlay(VS.o,function(i){if(i>=6&&!fly)fly=out();});
  vDraw(null);await (fly||out());VS.fps=f0;
}
function vReset(){if(!VS.box)return;cancelAnimationFrame(VS.raf);VS.raf=0;VS.box.style.display='none';if(VS.ctx)vDraw(null);}


/* ---------- visit counter (GoatCounter): page views per section and a few useful events ---------- */
var GC={q:[],t:0,n:0,last:''};
try{if(/[?&]nocount\b/.test(location.search))localStorage.setItem('skipgc','t');}catch(e){}
function gc(o){try{if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count(o);return;}GC.q.push(o);if(!GC.t){GC.t=setInterval(function(){GC.n++;if(window.goatcounter&&window.goatcounter.count){clearInterval(GC.t);GC.q.splice(0).forEach(function(x){window.goatcounter.count(x);});}else if(GC.n>40){clearInterval(GC.t);GC.q=[];}},500);}}catch(e){}}
function gcEvent(name,title){gc({event:true,path:name,title:title});}
function gcView(route){try{var path=String(route.hash||'#/').replace(/^#/,'')||'/';if(path===GC.last)return;GC.last=path;var ttl={home:'Home',gallery:'Gallery',about:'About',contact:'Contact',work:'Work'}[route.name];if(!ttl&&route.i!=null){var pr=state.projects[route.i];ttl='Case: '+pr.title;if(route.si!=null&&pr.subs&&pr.subs[route.si])ttl+=' / '+pr.subs[route.si].title;}gc({path:path,title:ttl||path});}catch(e){}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href')||'';if(/^mailto:/i.test(h))gcEvent('click-email','Contact: email');else if(/^tel:/i.test(h))gcEvent('click-phone','Contact: phone');else if(/t\.me|telegram/i.test(h))gcEvent('click-telegram','Contact: Telegram');else if(/instagram\.com/i.test(h))gcEvent('click-instagram','Contact: Instagram');else if(/linkedin\.com/i.test(h))gcEvent('click-linkedin','Contact: LinkedIn');else if(/behance\.net/i.test(h))gcEvent('click-behance','Contact: Behance');else if(/^https?:/i.test(h)&&a.host&&a.host!==location.host)gcEvent('click-external','Outbound link');},true);

if(document.fonts){var tabFs=function(){try{wtabsSync(false);cgSync(false);}catch(e){}};if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',tabFs);if(document.fonts.ready)document.fonts.ready.then(tabFs);}
