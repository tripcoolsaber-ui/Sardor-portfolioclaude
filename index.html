.pet-dock{position:fixed;right:clamp(14px,2.4vw,32px);bottom:calc(clamp(14px,2.4vw,32px) + env(safe-area-inset-bottom,0px));width:96px;height:96px;pointer-events:none}
/* about / contact */
.about,.contact{padding-top:128px;padding-bottom:120px;min-height:100svh}
.intro-row{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.statement{font-size:clamp(2rem,4.6vw,4.4rem);font-weight:600;letter-spacing:-.035em;line-height:1.04;margin:0;max-width:20ch}
.pet-spot{width:clamp(110px,13vw,170px);aspect-ratio:1}
.about-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;margin-top:96px;border-top:1px solid var(--line);padding-top:28px}
.about-grid h2{font-size:.95rem;font-weight:500;color:var(--muted);margin:0 0 14px}
.about-grid p{margin:0;white-space:pre-line}
.about-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.big{font-size:clamp(3rem,9vw,9rem);font-weight:600;letter-spacing:-.05em;line-height:.9;margin:0}
.lead{margin:40px 0 0;color:var(--muted);font-size:1.2rem;max-width:40ch}
.email{display:inline-block;margin-top:40px;font-size:clamp(1.5rem,3.4vw,3rem);font-weight:500;letter-spacing:-.03em;text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:4px;overflow-wrap:anywhere}
.clinks{list-style:none;padding:0;margin:56px 0 0;display:flex;flex-wrap:wrap;gap:12px 36px}
.clinks a{text-decoration:none;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:2px}
.clinks a:hover{border-color:var(--ink)}
/* pet */
#pet{position:fixed;left:0;top:0;width:200px;height:200px;z-index:30;pointer-events:none;transform-origin:100px 100px;opacity:0;transition:opacity .4s}
#pet .hopw,#pet .bob{position:absolute;inset:0}
#pet .bob{animation:bob 3.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.4deg)}}
#pet.sphere .bob{animation-duration:2.6s}
#pet.img:not(.sphere) .bob{animation:breathe 4.4s ease-in-out infinite;transform-origin:100px 190px}
@keyframes breathe{50%{transform:scale(1.008,1.014)}}
#pet .hopw.hop{animation:hop .42s cubic-bezier(.3,0,.3,1)}
#pet .hopw.hop .shadow{animation:hopsh .42s cubic-bezier(.3,0,.3,1)}
@keyframes hopsh{35%{transform:translateY(16px) scale(.72);opacity:.55}70%{transform:translateY(-2px)}}
@keyframes hop{35%{transform:translateY(-16px)}70%{transform:translateY(2px) scale(1.04,.96)}}
#pet .body{position:absolute;left:30px;top:30px;width:140px;height:124px;border-radius:50% 50% 47% 47%/54% 54% 46% 46%;background:radial-gradient(120% 100% at 30% 16%,#fff 0%,#f4f2ef 42%,#d8d4ce 100%);box-shadow:inset -6px -10px 18px rgba(20,30,50,.08),inset 4px 6px 10px rgba(255,255,255,.9),0 16px 30px -12px rgba(17,17,17,.28);transition:all .45s var(--ease)}
#pet .body::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:30%;border-radius:50%;border-top:1px solid rgba(20,30,50,.12);opacity:0;transition:opacity .45s}
#pet .body.squeeze{transform:scale(1.08,.88)}
#pet .face{position:absolute;left:15px;top:15px;width:110px;height:81px;border-radius:48% 48% 44% 44%/52% 52% 48% 48%;background:linear-gradient(165deg,#2c3037 0%,#0b0c0f 55%,#050506 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -4px 10px rgba(0,0,0,.6);overflow:hidden;transition:all .45s var(--ease)}
#pet .face::after{content:"";position:absolute;left:10%;top:5%;width:55%;height:32%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
#pet .eyes{position:absolute;left:50%;top:50%;transition:opacity .18s;scale:var(--sx,1) 1}
#pet .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center;color:#dff3ff;font:600 12px/1.05 "Instrument Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;text-shadow:0 0 3px #49B5FF,0 0 9px rgba(73,181,255,.65);opacity:0;clip-path:inset(0 100% 0 0);transition:opacity .2s,clip-path .5s steps(12,end)}
#pet .scr.glyph{clip-path:none;transition:opacity .22s}
#pet .scr svg{width:32px;height:32px;fill:none;stroke:#dff3ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #49B5FF) drop-shadow(0 0 5px rgba(73,181,255,.7))}
#pet .face::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);opacity:0;transition:opacity .3s;pointer-events:none}
#pet .face.on::before{opacity:0}
#pet .face.on .scr{opacity:1;clip-path:inset(0 0 0 0)}
#pet .face.on .eyes,#pet.hello .eyes{opacity:0}
#pet.sphere .scr{display:none}
#pet .eye::after{content:"";position:absolute;left:-16px;right:-16px;top:-19px;height:0;background:linear-gradient(180deg,rgba(8,9,12,0) 0%,#08090c 45%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);transition:height .6s var(--ease),transform .6s var(--ease)}
#pet.bored .eye::after{height:29px}
#pet.bored .eye:first-child::after{transform:rotate(-8deg)}#pet.bored .eye:last-child::after{transform:rotate(8deg)}
#pet.bored .eyes{transition:opacity .18s}
#pet.yawn .eye{transform:scaleY(.2);opacity:0}
#pet .mouth{position:absolute;left:49px;top:60px;width:12px;height:3px;border:3px solid #cdeeff;border-radius:50%;box-shadow:0 0 2px #2f8fff,0 0 7px #2f8fff,inset 0 0 5px rgba(47,143,255,.8);opacity:0;transition:all .5s var(--ease)}
#pet.yawn .mouth{opacity:1;left:45px;top:53px;width:20px;height:20px}
#pet .tear{position:absolute;left:89px;top:50px;width:6px;height:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#cdeeff;box-shadow:0 0 4px #2f8fff,0 0 8px rgba(47,143,255,.7);opacity:0}
#pet.yawn .tear{animation:tear 1.5s .5s ease-in forwards}
@keyframes tear{0%{opacity:0;transform:translateY(-2px) scale(.4)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(17px) scale(.8)}}
#pet.yawn .hopw{transform:translateY(2px) scale(1.01,.98);transition:transform .6s var(--ease)}
#pet .hopw{transition:transform .5s var(--ease)}
#pet .scr.big{transition:opacity .25s,clip-path .9s steps(18,end);font-size:20px;letter-spacing:-.02em;white-space:nowrap;font-family:"Instrument Sans","Manrope","Helvetica Neue",Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Apple SD Gothic Neo","PingFang SC","Microsoft YaHei","Malgun Gothic","Noto Sans CJK SC","Geeza Pro","Segoe UI","Noto Sans Arabic",sans-serif}
#pet .scr.rtl{direction:rtl;clip-path:inset(0 0 0 100%)}
#pet .face.on .scr.rtl{clip-path:inset(0 0 0 0)}
#pet.sphere .mouth,#pet.sphere .tear{display:none}
#pet .batt{position:absolute;left:36px;top:30px;width:32px;height:20px;box-sizing:border-box;border:3px solid #cdeeff;border-radius:5px;box-shadow:0 0 3px #2f8fff,0 0 8px rgba(47,143,255,.7);opacity:0;transform:scale(.8);transition:opacity .35s .15s,transform .35s .15s var(--ease)}
#pet .batt::after{content:"";position:absolute;right:-7px;top:4px;width:3px;height:6px;border-radius:0 2px 2px 0;background:#cdeeff;box-shadow:0 0 4px #2f8fff}
#pet .batt i{position:absolute;left:2px;top:2px;bottom:2px;width:6px;border-radius:1.5px;background:#cdeeff;box-shadow:0 0 4px #2f8fff}
#pet.yawn .batt{opacity:1;transform:none}
#pet.yawn .batt i{animation:battLow .5s steps(2) infinite}
@keyframes battLow{50%{opacity:.15}}
#pet.sphere .batt{display:none}
#pet .rimgs{position:absolute;inset:0;transform-origin:100px 100px;transition:opacity .3s}
#pet .rimgs img{position:absolute;left:0;top:0;width:200px;height:200px;opacity:0}
#pet .rimgs img.on{opacity:1}
#pet.sphere .rimgs{opacity:0}
#pet.img:not(.sphere) .body{background:none;box-shadow:none}
#pet.img:not(.sphere) .body::after{opacity:0}
#pet.img:not(.sphere) .face{background:none;box-shadow:none;border-radius:50%/52%}
#pet.img:not(.sphere):not(.morph) .face{transition:none}
#pet.img .face::after{display:none}
#pet.img:not(.sphere) .paw{opacity:0}
#pet.img:not(.sphere) .shadow{top:181px;left:44px;width:112px}
#pet.refl:not(.sphere) .shadow{top:183px;left:40px;width:120px;height:14px;background:radial-gradient(closest-side,rgba(18,28,48,.42),rgba(18,28,48,.16) 55%,rgba(18,28,48,0))}
#pet.refl:not(.sphere){-webkit-box-reflect:below -22px linear-gradient(to bottom,transparent 46%,rgba(0,0,0,.26) 100%)}
@supports (background:-moz-element(#x)){#pet.refl:not(.sphere) .hopw::after{content:"";position:absolute;left:0;top:178px;width:200px;height:200px;background:-moz-element(#petbob) no-repeat;transform:scaleY(-1);opacity:.26;mask-image:linear-gradient(to bottom,transparent 46%,#000);pointer-events:none}}
#pet.boot{visibility:hidden}
#pet .rland{position:absolute;left:0;top:0;width:200px;height:200px;display:none;pointer-events:none}
#pet.landing .rland{display:block}
#pet.landing .rimgs{opacity:0;transition:none}
#pet.landing .eyes,#pet.landing .scr{opacity:0}
#pet.waking .eyes{transition:opacity .8s ease}
#pet .dz{position:absolute;left:50%;top:50%;opacity:0;transition:opacity .2s;scale:var(--sx,1) 1;pointer-events:none}
#pet.dizzy .dz{opacity:1}
#pet.dizzy .eyes{opacity:0}
#pet .iris{position:absolute;left:calc(100px + var(--lx,0px));top:calc(100px + var(--ly,0px));width:22px;height:30px;margin:-15px 0 0 -11px;border-radius:50%;z-index:6;pointer-events:none;opacity:0;transform:scale(0);
 background:radial-gradient(circle,rgba(0,0,0,0) 0 9%,rgba(0,0,0,.0) 10%),repeating-conic-gradient(from 0deg,#05070c 0 52deg,#2a3242 52deg 60deg);box-shadow:inset 0 0 3px rgba(0,0,0,.9),0 0 0 1px rgba(160,170,185,.35)}
#pet.lensblink .iris{animation:irisb .58s cubic-bezier(.45,0,.25,1)}
@keyframes irisb{0%{opacity:1;transform:scale(.05) rotate(0deg)}36%{opacity:1;transform:scale(1) rotate(75deg)}60%{opacity:1;transform:scale(1) rotate(75deg)}100%{opacity:1;transform:scale(.05) rotate(150deg)}}
#pet .hopw{rotate:0deg;transform-origin:100px 190px;transition:rotate .4s cubic-bezier(.3,1.5,.5,1)}
#pet.leaning .hopw{rotate:var(--lean,0deg)}
#pet.angry .eye::after{height:30px}
#pet.angry .eye:first-child::after{transform:rotate(17deg)}#pet.angry .eye:last-child::after{transform:rotate(-17deg)}
#pet.angry .eye{transform:scale(.94)}
#pet.angry .bob{animation:angshake .32s ease-in-out infinite;transform-origin:100px 190px}
@keyframes angshake{25%{transform:translateX(-1px) rotate(-.8deg)}75%{transform:translateX(1px) rotate(.8deg)}}
#pet .scr.warn{clip-path:none!important;transition:opacity .15s;padding:0}
#pet .wm{display:flex;flex-direction:column;align-items:center;gap:0;font-family:Poppins,"Instrument Sans","Helvetica Neue",Arial,sans-serif;font-weight:800;line-height:.96;letter-spacing:-.01em;color:#eef8ff;text-shadow:0 0 3px #2f8fff,0 0 9px rgba(47,143,255,.7)}
#pet .wm span{display:inline-block;white-space:nowrap;opacity:0;animation:wmIn .5s cubic-bezier(.2,1.5,.35,1) forwards}
#pet .wm span:nth-child(2){font-weight:700}
@keyframes wmIn{0%{opacity:0;transform:translateY(5px) scale(.55);filter:blur(2px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none}}
#pet.angry .wm span:first-child{animation:wmIn .5s cubic-bezier(.2,1.5,.35,1) forwards,wmPulse 1.2s .8s ease-in-out infinite}
@keyframes wmPulse{50%{transform:scale(1.06)}}
#pet .dz svg{position:absolute;top:-17px;width:34px;height:34px;overflow:visible;filter:drop-shadow(0 0 2px #2f8fff) drop-shadow(0 0 6px rgba(47,143,255,.8));animation:dzspin .75s linear infinite}
#pet .dz svg:first-child{left:-37.5px}#pet .dz svg:last-child{left:12.5px;animation-duration:.9s}
#pet .dz path{fill:none;stroke:#d6f1ff;stroke-width:3;stroke-linecap:round}
@keyframes dzspin{to{transform:rotate(360deg)}}
#pet.dizzy .bob{animation:dzwob .55s ease-in-out infinite;transform-origin:100px 190px}
@keyframes dzwob{25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}
#pet.sphere .dz{display:none}
#pet .sphimg{position:absolute;left:40px;top:40px;width:120px;height:120px;opacity:0;pointer-events:none}
#pet .sphwrap{position:absolute;left:40px;top:40px;width:120px;height:120px;opacity:0;pointer-events:none}
#pet .sphwrap img{position:absolute;inset:0;width:100%;height:100%}
#pet.rsph.sphere:not(.xform) .sphwrap{opacity:1}
#pet.sphere.deploy .rland{display:block!important}
#pet.deploy .sphwrap{opacity:0!important}
#pet.rsph.sphere .body,#pet.rsph.sphere .paw,#pet.rsph.sphere .pod,#pet.rsph.sphere .antenna{opacity:0!important;transition:none!important}
#pet.img .body,#pet.img .paw{transition:none!important}
#pet.img .face{transition:none!important}
#pet.rsph .lens{display:none!important}
#pet.xform .rland{display:block!important}
#pet.xform .rimgs{opacity:0;transition:none}
#pet.xform .eyes,#pet.xform .scr{opacity:0;transition:none}
#pet.antic .rland{display:block}
#pet.antic .rimgs{opacity:0;transition:none}
@keyframes rfade{from{opacity:0}to{opacity:1}}
#pet.sphere .rland{display:none}
#pet.antic.blink .eye{transform:none}
#pet .eye{position:absolute;top:-9px;width:28px;height:28px;border-radius:50%;background:transparent;border:4.5px solid #cdeeff;box-shadow:0 0 2px #2f8fff,0 0 7px #2f8fff,0 0 15px rgba(47,143,255,.6),inset 0 0 2px #2f8fff,inset 0 0 7px rgba(47,143,255,.8);transition:transform .14s,opacity .3s,border-color .2s}
#pet .eye:first-child{left:-39px}#pet .eye:last-child{left:11px}
#pet.blink .eye{transform:scaleY(.1)}
#pet.happy .eye{border-bottom-color:transparent;transform:scaleY(.7) translateY(-3px)}
#pet .pod,#pet .antenna{display:none}
#pet .lens{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#bfe6ff 24%,#49B5FF 48%,rgba(73,181,255,0) 74%);opacity:0;transform:scale(.4);transition:all .4s var(--ease)}
#pet .paw{position:absolute;top:140px;width:32px;height:28px;border-radius:46% 46% 50% 50%/40% 40% 60% 60%;background:radial-gradient(100% 100% at 40% 25%,#fff 0%,#e9e6e1 45%,#c9c4bc 100%);box-shadow:0 5px 10px rgba(17,17,17,.2);transition:all .4s var(--ease)}
#pet .paw.l{left:48px}#pet .paw.r{left:120px}
#pet .pod{position:absolute;top:76px;width:14px;height:34px;border-radius:8px;background:linear-gradient(90deg,#e4e7ec,#fff);box-shadow:0 2px 4px rgba(17,17,17,.1);transition:all .35s var(--ease)}
#pet .pod.l{left:20px}#pet .pod.r{left:166px;background:linear-gradient(90deg,#fff,#dfe3e8)}
#pet .antenna{position:absolute;left:88px;top:25px;width:24px;height:16px;border-radius:12px 12px 4px 4px;background:linear-gradient(#fff,#e1e5ea);box-shadow:0 2px 4px rgba(0,0,0,.08);transition:all .35s var(--ease)}
#pet .shadow{position:absolute;left:48px;top:158px;width:104px;height:18px;border-radius:50%;background:radial-gradient(rgba(17,17,17,.2),rgba(17,17,17,0) 70%);transition:all .45s var(--ease)}
#pet .hit{position:absolute;left:30px;top:30px;width:140px;height:130px;border-radius:50%;pointer-events:none;cursor:pointer}
#pet.clickable .hit{pointer-events:auto}
#pet.sphere .body{left:40px;top:40px;width:120px;height:120px;border-radius:60px;background:radial-gradient(100% 100% at 36% 26%,#fff 0%,#f2f4f7 40%,#d2d8df 100%)}
#pet.sphere .body::after{opacity:1}
#pet.sphere .face{left:38px;top:-2px;width:44px;height:44px;border-radius:22px}
#pet.sphere.aim-right .face{left:68px;top:24px}
#pet.sphere .eye{opacity:0;transform:scale(.3)}
#pet.sphere .lens{opacity:1;transform:scale(1)}
#pet.sphere .paw{transform:translateY(-30px) scale(.2);opacity:0}
#pet.sphere .pod{transform:scale(0);opacity:0}
#pet.sphere .antenna{transform:translateY(22px) scale(.2);opacity:0}
#pet.sphere .shadow{left:56px;top:152px;width:88px}
#trail{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:29;filter:blur(6px);will-change:filter}
#beamwrap{position:fixed;inset:0;pointer-events:none;z-index:28;filter:blur(16px)}
#beam{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;background:linear-gradient(90deg,rgba(165,222,255,.85),rgba(73,181,255,.34) 35%,rgba(73,181,255,.12) 100%)}
#shutter{position:fixed;inset:0;width:100vw;height:100vh;z-index:60;display:none;pointer-events:none}
#vshut{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;overflow:hidden}
#vshut canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#vshut video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0}
body.busy #pet{z-index:70}body.busy #trail{z-index:65}
body.busy{cursor:progress}
/* editor */
.edit-fab{position:fixed;left:clamp(14px,2.4vw,32px);bottom:calc(clamp(14px,2.4vw,32px) + env(safe-area-inset-bottom,0px));z-index:45;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500;cursor:pointer;box-shadow:0 8px 24px -12px rgba(17,17,17,.3)}
.edit-fab.dirty::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
dialog{border:none;border-radius:16px;padding:0;background:var(--bg);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.ed{padding:24px;display:grid;gap:18px}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ed-head h2{margin:0;font-size:1.3rem;font-weight:600;letter-spacing:-.02em}
.ed-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ed-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-list .t{flex:1;font-weight:500;min-width:120px}
.ed-list .n{color:var(--muted);font-variant-numeric:tabular-nums;width:24px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.b{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;font-size:.88rem}
.b:hover:not(:disabled){border-color:var(--ink)}
.b:disabled{opacity:.35;cursor:default}
.b.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.ed-row{display:flex;gap:8px;flex-wrap:wrap}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.ed-status{color:var(--muted);font-size:.9rem}
.fld{display:grid;gap:6px;font-size:.88rem;font-weight:500}
.fld input,.fld textarea{font:inherit;font-weight:400;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{margin:0;color:var(--muted);font-size:.86rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mi{display:grid;gap:6px}
.mi .th{aspect-ratio:4/3;background:var(--bg2);border-radius:6px;overflow:hidden;display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.mi .th img,.mi .th video{width:100%;height:100%;object-fit:cover}
.mi .acts .b{padding:4px 9px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
/* responsive */
@media (max-width:900px){
 .scene{transform:translate(-64%,-50%)}
 .home-in{align-items:flex-start;padding-top:110px}
 .work{grid-template-columns:1fr;padding-top:108px;gap:28px}
 .work-right{order:-1}
 .preview{position:static}
 .preview{height:auto}
 .preview-frame{position:relative;width:100%;top:auto!important;transform:none}
 .pg-title{margin-bottom:24px}
 .plist a{padding:18px 0;grid-template-columns:40px auto 1fr}

 mascot and campaigns for OSON’s travel eSIM.","desc":"Identity, mascot and campaigns for OSON eSIM, the travel product that keeps people online in 177+ countries without a physical SIM.","role":"Logo · Mascot · Campaigns","industry":"Telecom / Travel","deliverables":"Logo and app icon, mascot, social posts, airport screen ad, video ads","img":{},"card":{"type":"image","src":"esim-card-chip.webp","ratio":"1672/941"},"chapters":[{"title":"Overview","text":"eSIM is OSON’s travel product: mobile internet in 177+ countries, bought inside the app, no plastic SIM and no roaming bill. The brand needed a mark that holds at app-icon size, a friendly character and campaigns that make staying connected feel easy.","media":[],"noimg":true},{"title":"The mark","text":"A lowercase “e” drawn in one stroke, signal waves rising from it, and a clean, rounded “sim”. Every part has a job; the notes explain them.","media":[],"anno":{"img":{"src":"esim-logo-dark.webp","ratio":"1391/845"},"symbols":"Signal|Waves rising from the e: always connected\nThe e|The symbol of the electronic SIM, in one rounded stroke\nSlanted bar|Tilts up to the waves: letter and signal as one\nRound dot|Echoes the soft ends of the waves and the app icon\nWordmark|Bold rounded lowercase, readable at icon size\nColor|Cyan symbol, navy word, white on dark","pts":[{"i":0,"x":0.505,"y":0.215,"ly":20,"s":"r"},{"i":3,"x":0.64,"y":0.53,"ly":135,"s":"r"},{"i":4,"x":0.88,"y":0.72,"ly":250,"s":"r"},{"i":1,"x":0.06,"y":0.6,"ly":20,"s":"l"},{"i":2,"x":0.22,"y":0.66,"ly":135,"s":"l"},{"i":5,"x":0.14,"y":0.4,"ly":250,"s":"l"}]}},{"title":"Colour and mono","text":"The mark in the main blue and navy, reversed on blue and navy, and in one colour: black on white and white on graphite, so it holds on any ground.","media":[{"type":"image","src":"esim-board-colors2.webp","ratio":"2000/878"},{"type":"image","src":"esim-board-mono2.webp","ratio":"2000/666"}]},{"title":"App icon and screens","text":"The mark in a rounded square on navy tamed by a spray of the Rust converter under a stop sign.","placement":"Instagram · Telegram"},{"type":"image","src":"c38ffb94bde14ee9c24cf419b4b4a243.webp","ratio":"3937/5567","group":"Creatives","title":"Earn with WOG: antifreeze, vertical","idea":"The antifreeze promo rebuilt for a vertical format: the courier with three boxes beside the whole range.","placement":"Instagram · Telegram"},{"type":"image","src":"509f170f310a3553d8a1d1bfab121137.webp","ratio":"1890/2362","group":"Creatives","title":"Air conditioner refresher","idea":"A sunlit dashboard vent and the can up close, with three line icons: odours gone, fir scent, antibacterial.","placement":"Instagram · Telegram"},{"type":"image","src":"240139f1d7522bd656bbb33870fa5b60.webp","ratio":"1890/2362","group":"Creatives","title":"Care and protection","idea":"A sports car wrapped in WOG yellow on black, with the car care range lined up in front.","placement":"Instagram · Telegram"},{"type":"image","src":"7d3914596bd0dcd38d3a07170309342e.webp","ratio":"5906/7382","group":"Creatives","title":"Diesel anti-gel down to −57°","idea":"Three anti-gel cans on a black plinth against bright yellow, with the frost limit set large in red.","placement":"Instagram · Telegram"},{"type":"image","src":"c3d95e3a07daacc335f4650a4ad152ff.webp","ratio":"2362/2953","group":"Creatives","title":"Brand of the Year in Russia 2024","idea":"A news post on WOG becoming a laureate in the Chemical Products category: the diplomas and trophy, framed in brand black and yellow.","placement":"Instagram · Telegram"},{"type":"image","src":"dbcb39cb2d1bef717db58b4aa32abb05.webp","ratio":"2362/2953","group":"Creatives","title":"Aerosol De-Cox","idea":"The can and its box over a dark engine, with icons for oil control, the long tube and compression.","placement":"Instagram · Telegram"},{"type":"image","src":"d231e1f16407fc13c5f579cd0b23151e.webp","ratio":"2362/2953","group":"Creatives","title":"Camshaft oil seal","idea":"The seal in its yellow pack, with  strip|The vertical WOG block runs on every label: the brand reads first, even on a crowded shelf\nCategory|“Auto Chemistry” names the family the product belongs to\nDesigned in Germany|The flag stripe marks where the product was developed\nApprovals|Car-maker specifications sit in one compact block at the base\nProduct type|“Fully synthetic motor oil”: red for the base, black for the type\nViscosity and class|5W-30 set large, with the API/ACEA class and the PAO badge beside it\nLine name|Urban with its HT tab: every line owns a name and a tab\nIcon, QR and volume|The engine icon, a QR code and the volume close the label","pts":[{"i":0,"x":0.16,"y":0.24,"ly":20,"s":"l"},{"i":1,"x":0.17,"y":0.62,"ly":125,"s":"l"},{"i":2,"x":0.17,"y":0.86,"ly":228,"s":"l"},{"i":3,"x":0.45,"y":0.9,"ly":352,"s":"l"},{"i":4,"x":0.6,"y":0.3,"ly":50,"s":"r"},{"i":5,"x":0.5,"y":0.43,"ly":145,"s":"r"},{"i":6,"x":0.79,"y":0.67,"ly":245,"s":"r"},{"i":7,"x":0.86,"y":0.8,"ly":345,"s":"r"}]}},{"title":"Construction","text":"Each label is a die-cut pair: a front panel shaped to the canister’s shoulder and a back panel for the full technical text, hazard marks and barcode. The same structure is drawn for the 4 litre canister and the 1 litre bottle.","media":[{"type":"image","src":"wog-oils-flat-4l.webp","ratio":"1890/1181"},{"type":"image","src":"wog-oils-flat-1l.webp","ratio":"1730/1091"}]},{"title":"Formats","text":"The label is built to scale. On the 1 litre bottle and the 4 litre canister every zone keeps its order and proportions; only the size and the volume mark change.","media":[{"type":"image","src":"wog-oils-formats.webp","ratio":"1540/1204"}]},{"title":"The system","text":"One grid carries the whole range. The brand strip, the type block and the base line never move; only the line name, the viscosity and the approvals change, so every product reads as part of one family. Below, a selection of fronts from the Urban HT and Ultra Protect lines, then the full set on the shelf.","media":[{"type":"image","src":"wog-oils-fronts-grid.webp","ratio":"2000/1316"},{"type":"image","src":"wog-oils-lineup-4l.webp","ratio":"2000/740"}]},{"title":"Color","text":"The palette comes from the brand’s German roots: the yellow, black and red of the flag, with blue and cool gray as supporting colors. On the label, yellow is the base, black carries the brand strip and type, and red marks the product type and the line tab. Below, the approved color pairings.","palette":"#FFE400|Yellow · Pantone 109C\n#2D2B2D|Black · Pantone Black C\n#E21F2C|Red · Pantone 485C\n#00ADD7|Blue · Pantone 639C\n#D2D3D2|Gray · Cool Gray 2C","media":[{"type":"image","src":"wog-palette-combos.webp","ratio":"1960/360"}]},{"title":"Applications","text":"The system carries into the B2B presentation: the same yellow, black and red, the same type, and the range laid out line by line.","car":true,"media":[{"type":"image","src":"0f0296130585e5b2738a46ac868ea4a5.webp","ratio":"1920/1222","group":"Project","title":"Slide 01 · Cover","idea":"","placement":"Presentation"},{"type":"image","src":"48cbafc821baa495160095715c4feaf3.webp","ratio":"1920/1222","group":"Project","title":"Slide 02 · Mission","idea":"","placement":"Presentation"},{"type":"image","src":"91446032f0ad88519a063395e9ee2de8.webp","ratio":"1920/1222","group":"Project","title":"Slide 03 · About the company","idea":"","placement":"Presentation"},{"type":"image","src":"41cbfde837c174bed66cdaf24e2042fe.webp","ratio":"1920/1222","group":"Project","title":"Slide 04 · Production","idea":"","placement":"Presentation"},{"type":"image","src":"60fe4b00200555a4e4c6feb6768802da.webp","ratio":"1920/1222","group":"Project","title":"Slide 05 · RENOMIX technology","idea":"","placement":"Presentation"},{"type":"image","src":"5f2c7f95ad003b268858383ecf7e110b.webp","ratio":"1920/1222","group":"Project","title":"Slide 06 · The range","idea":"","placement":"Presentation"},{"type":"image","src":"80f434ff7dd0eed1a36a6ad7d0270552.webp","ratio":"1920/1222","group":"Project","title":"Slide 07 · Advantages","idea":"","placement":"Presentation"},{"type":"image","src":"691fafff51174a25e0ed99bd640fcfce.webp","ratio":"1920/1222","group":"Project","title":"Slide 08 · Made to order","idea":"","placement":"Presentation"},{"type":"image","src":"430f6dfbee8e015ec7617a9944682822.webp","ratio":"1920/1222","group":"Project","title":"Slide 09 · Why WOG","idea":"","placement":"Presentation"},{"type":"image","src":"03a51e66201bb186a32246b33be7cef6.webp","ratio":"1920/1222","group":"Project","title":"Slide 10 · Quality control","idea":"","placement":"Presentation"},{"type":"image","src":"4d823ca15b623da2dfd49152a5f261a3.webp","ratio":"1920/1222","group":"Project","title":"Slide 11 · B2B terms","idea":"","placement":"Presentation"},{"type":"image","src":"13cd56fd75ccfbdf19c8e4713584cb3d.webp","ratio":"1920/1222","group":"Project","title":"Slide 12 · Support","idea":"","placement":"Presentation"},{"type":"image","src":"ef730697f6336229c91f771cb3dbdb06.webp","ratio":"1920/1222","group":"Project","title":"Slide 13 · Urban HT line","idea":"","placement":"Presentation"},{"type":"image","src":"6e04eea3f515f73323194c365fe6546c.webp","ratio":"1920/1222","group":"Project","title":"Slide 14 · Ultra Protect line","idea":"","placement":"Presentation"}]}],"myrole":"Packaging design\nLabel system for the range\nTypography and color\nIcons and markings\nB2B presentation","card":{"src":"0f0296130585e5b2738a46ac868ea4a5.webp","ratio":"1920/1222"},"heroW":"min(520px,100%)"},{"slug":"moto-line","title":"Moto Line","sub":"Packaging design","desc":"Packaging for WOG Motoline, the brand’s range for motorcycles: motor oils for every riding style and a G1 to G5 kit for chain and air filter care.","role":"Sub-brand · Packaging design","industry":"Automotive / Motorcycles","deliverables":"Labels for 4 oils in 1 and 4 L and 5 care products, launch posters","img":{"hero":{"src":"moto-hero-posters.webp","ratio":"2016/1400"},"top":{"type":"image","src":"moto-line-rocks.webp","ratio":"1086/1448"}},"cardDesc":"Motoline: motor oils for every riding style and a G1–G5 care kit.","card":{"src":"moto-card.webp","ratio":"2000/1036"},"chapters":[{"title":"Overview","text":"Motoline takes the WOG car range onto two wheels. The label turns dark graphite, the yellow strip stays, and the brand gains its own word: Motoline. Two families share one system: motor oils and the chain and filter care kit.","media":[{"type":"image","src":"moto-oils-4l.webp","ratio":"2000/638"},{"type":"image","src":"moto-care-renders.webp","ratio":"2000/780"}]},{"title":"Label anatomy","text":"The print-ready front label of Urban Street. The structure follows the car range, but the hero is the motorcycle: a line-art motorcycle that tells the rider which oil is theirs.","anno":{"img":{"src":"moto-front-4l.webp","ratio":"1604/1951"},"symbols":"WOG / Motoline strip|The WOG block from the car range, now with “Motoline”: the same family, a new category\nDesigned in Germany|The flag carries over from the car range\nProduct type and viscosity|“Fully synthetic motor oil 10W-40” in one block, yellow on graphite\nApprovals|JASO and API classes at the base, red for the label, white for the values\nThe bike|Each line gets its own line-art motorcycle, so the rider finds their oil by the bike, not the code\n4T badge|Four-stroke marked in a yellow badge, readable at a glance\nLine and style|Urban or Ultra, with a red tab for the riding style: Street, Hard enduro, Long life, Sport\nQR and volume|A QR code and the volume close the label","pts":[{"i":0,"x":0.191,"y":0.249,"ly":20,"s":"l"},{"i":1,"x":0.191,"y":0.809,"ly":125,"s":"l"},{"i":2,"x":0.491,"y":0.6,"ly":228,"s":"l"},{"i":3,"x":0.509,"y":0.865,"ly":352,"s":"l"},{"i":4,"x":0.594,"y":0.353,"ly":50,"s":"r"},{"i":5,"x":0.837,"y":0.581,"ly":145,"s":"r"},{"i":6,"x":0.622,"y":0.742,"ly":245,"s":"r"},{"i":7,"x":0.837,"y":0.809,"ly":345,"s":"r"}]}},{"title":"Lockup","text":"The product name is built as one lockup: the oil type and viscosity on top, the line name set large, and the riding style on a red tab that cuts into the letters. The same lockup runs on the front and the back of every label.","media":[{"type":"image","src":"moto-lockup.webp","ratio":"1384/820"}]},{"title":"Motor oils","text":"Four oils, four bikes: a street bike for Urban Street, an enduro for Urban Hard enduro, a cruiser for Ultra Long life and a sport bike for Ultra Sport. Same grid, same strip; the drawing and the style tab change.","media":[{"type":"image","src":"moto-oil-fronts.webp","ratio":"2000/682"},{"type":"image","src":"moto-oils-1l.webp","ratio":"2000/745"}]},{"title":"Formats","text":"Every oil comes in a 1 litre bottle and a 4 litre canister. The label keeps its zones and the bike in both; the drawing scales with the pack, so the 4 litre canister gets the bigger motorcycle.","media":[{"type":"image","src":"moto-formats.webp","ratio":"1520/1201"}]},{"title":"Illustrations","text":"Each motorcycle goes from a photo reference through a line study of shapes and proportions to the final line art used on the label: a street bike, an enduro, a cruiser and a sport bike, white line work set to read on graphite.","media":[{"type":"image","src":"moto-process-street.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-enduro.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-cruiser.webp","ratio":"2000/480"},{"type":"image","src":"moto-process-sport.webp","ratio":"2000/480"}]},{"title":"Care kit G1–G5","text":"The care products are numbered like a kit, G1 to G5, with a large outline numeral and a line drawing of the part: the chain for cleaning and lubrication, the filter for cleaning and oiling.","media":[{"type":"image","src":"moto-care-renders.webp","ratio":"2000/780"},{"type":"image","src":"moto-care-labels.webp","ratio":"2000/1174"}]},{"title":"Construction","text":"The oils use a die-cut pair: a front label with the bike and a back label with Russian and English text, hazard marks and the barcode, drawn for tive / Paints","deliverables":"Cans, gift box, poster, outdoor advertising, instruction, palette","img":{"hero":{"src":"wog-art-cover.webp","ratio":"2000/1116"}},"cardDesc":"Cans, gift box, poster, outdoor advertising, instruction and a 16-shade palette for the WOG art. spray paints.","chapters":[{"title":"Overview","text":"WOG art. is a sub-brand of spray paints for creative people: white cans with a glossy 3D object in the colour of each paint, set against concrete and graffiti. The board gathers the logo, palette, typography, graphic elements, key visuals and patterns; the pages below show the system in use: the instruction, the gift box, the poster, outdoor advertising and the 16-shade palette.","media":[{"type":"image","src":"wog-art-board.webp","ratio":"2400/1792"}]},{"title":"Packaging","text":"A black gift box with a window for three cans, splashed with white and orange paint and marked with a crown tag: the set 05, 07 and 003 as it stands on the shelf.","media":[{"type":"image","src":"wog-art-box.webp","ratio":"1600/2143"}]},{"title":"Poster","text":"A poster with the three cans on concrete steps under the line “Spray paint for bolder ideas”.","media":[{"type":"image","src":"wog-art-poster.webp","ratio":"1600/2143"}]},{"title":"Outdoor advertising","text":"A giant can and a glossy orange form on the wall of a building, painted in a street-art style with the line “More than color” and a crown tag.","media":[{"type":"image","src":"wog-art-outdoor.webp","ratio":"1122/1402"}]},{"title":"Palette","text":"Sixteen shades as glossy paint blots with their numbers and names, under “16 shades. Zero limits.” and the sign-off “Color your world”.","media":[{"type":"image","src":"wog-art-palette.webp","ratio":"1600/2143"}]},{"title":"Instruction","text":"A step-by-step poster for the user: prepare the surface, shake the can, make a test spray, apply thin coats and clean the nozzle, with icons for the materials it suits, drying time, working temperature and a durable coati function vBitmaps(){if(!window.createImageBitmap)return;var q=[];[VS.c,VS.o].forEach(function(L){L.forEach(function(im,i){q.push([L,i,im]);});});
 (function next(){var t=q.shift();if(!t)return;createImageBitmap(t[2],{resizeWidth:800,resizeHeight:450,resizeQuality:'medium'}).then(function(b){if(t[0][t[1]]===t[2])t[0][t[1]]=b;}).catch(function(){}).then(function(){setTimeout(next,14);});})();}
function vInit(){VS.box=$('#vshut');VS.cv=$('#vs-canvas');var el=document.getElementById(mqNarrow.matches?'sframesm':'sframes');if(!el){VS.dead=true;return;}var d;try{d=JSON.parse(el.textContent);}catch(e){VS.dead=true;return;}
 vMk(d).then(function(st){vUse(st);VS.ok=true;vHi();},function(){VS.dead=true;});}
/* sharper 2560x1440 frames for high-density desktop screens; the embedded 1920 set stays if this fails */
function vHi(){if(mqNarrow.matches||Math.max(innerWidth,innerHeight*16/9)*(window.devicePixelRatio||1)<=2100||!window.fetch)return;
 fetch(VS.hi).then(function(r){if(!r.ok)throw new Error('hi');return r.json();}).then(vMk).then(function(st){(function swap(){if(busy)return setTimeout(swap,300);vUse(st);VS.isHi=true;})();}).catch(function(){});}
frPet.then(function(){return frLoad(mqNarrow.matches?'sframesm':'sframes');}).then(function(){vInit();});
function fadeSwap(doSwap){return stage.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'}).finished.catch(function(){}).then(function(){doSwap();stage.getAnimations().forEach(function(a){a.cancel();});return stage.animate([{opacity:0},{opacity:1}],{duration:320}).finished.catch(function(){});});}
function vReady(){return VS.ok&&!VS.dead;}
function waitReady(ms){return new Promise(function(res){var t0=performance.now();(function f(){if(vReady()||VS.dead||performance.now()-t0>ms)return res();requestAnimationFrame(f);})();});}
function vSize(vw,vh){var r=VS.box?VS.box.getBoundingClientRect():null;if(r&&r.width&&r.height){vw=r.width;vh=r.height;}var ar=(VS.cv.width||16)/(VS.cv.height||9),k=mqNarrow.matches?1.12:1,w=Math.max(vw*k,vh*k*ar);VS.cv.style.width=w+'px';VS.cv.style.height=(w/ar)+'px';}
function vDraw(im){var x=VS.ctx;x.clearRect(0,0,VS.cv.width,VS.cv.height);if(im&&(im.naturalWidth||im.width)){try{x.drawImage(im,0,0,VS.cv.width,VS.cv.height);}catch(e){}}}
function seqPlay(fr,hook){return new Promise(function(res){var t0=performance.now(),last=-1;function f(now){var i=Math.max(0,Math.floor((now-t0)*VS.fps/1000));if(i>=fr.length){vDraw(fr[fr.length-1]);VS.raf=0;return res();}if(i!==last){last=i;vDraw(fr[i]);if(hook)hook(i);}VS.raf=requestAnimationFrame(f);}f(t0);});}
/* phones: the same shutter, but quick (about 0.6 s to the new page) and the robot simply fades out and back in */
async function videoShutterM(vw,vh,doSwap){
  var f0=VS.fps,bk=false;VS.fps=54;
  VS.box.style.display='block';vSize(vw,vh);vDraw(null);
  var po=+getComputedStyle(petEl).opacity||0;if(po>0)petEl.animate([{opacity:po},{opacity:0}],{duration:150,fill:'forwards'});
  var zo=stage.animate([{transform:'scale(1)'},{transform:'scale(.95)'}],{duration:540,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  await seqPlay(VS.c);
  zo.cancel();doSwap();
  stage.style.transformOrigin='50% '+(vh/2)+'px';
  stage.animate([{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:560,easing:'cubic-bezier(.2,.7,.2,1)'});
  await seqPlay(VS.o,function(i){if(i>=7&&!bk){bk=true;petEl.getAnimations().forEach(function(a){a.cancel();});var to=anchorPose();if(to){setMode(to.mode);place(to.x,to.y,to.k);petEl.style.opacity='1';petEl.animate([{opacity:0},{opacity:1}],{duration:300,easing:'ease-out'});}else petEl.style.opacity='0';}});
  VS.fps=f0;vDraw(null);
}
async function videoShutter(vw,vh,doSwap){
  var f0=VS.fps;if(mqNarrow.matches)VS.fps=46;
  var sc=Math.max(vw/1920,vh/1080),cx=vw/2,cy=vh/2-2.4*sc,jump=null,fly=null;
  VS.box.style.display='block';vSize(vw,vh);vDraw(null);
  var zo=stage.animate([{transform:'scale(1)'},{transform:'scale(.93)'}],{duration:720,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  var toC=function(){return petMove({x:cx,y:cy,k:64*sc/120},{dur:340});};
  var k0=64*sc/120,dive=function(){return toC().then(function(ok){if(!ok)return;return tween(190,function(e){place(cx,cy,k0*(1-.88*e));petEl.style.opacity=String(1-e);canvas.style.opacity=String(1-e);}).then(function(){pts.length=0;canvas.style.opacity='';});});};
  await seqPlay(VS.c,function(i){if(i>=5&&!jump)jump=dive();});
  await (jump||dive());
  zo.cancel();doSwap();
  stage.style.transformOrigin='50% '+(vh/2)+'px';
  stage.animate([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:720,easing:'cubic-bezier(.2,.7,.2,1)'});
  var out=function(){var k1=64*sc/120;place(cx,cy,k1*.12);petEl.style.opacity='0';return tween(170,function(e){place(cx,cy,k1*(.12+.88*e));petEl.style.opacity=String(e);}).then(out2);};
  var out2=function(){var to=anchorPose();if(!to)return Promise.resolve();if(to.mode==='robot'&&LD.ok&&PF){return petMove(to,{dur:400}).then(function(){if(XF.ok&&ANT.ok)playUnfold();else{setMode('robot');playLand();}});}setTimeout(function(){setMode(to.mode);},150);return petMove(to,{dur:400});};
  await seqPlay(VS.o,function(i){if(i>=6&&!fly)fly=out();});
  vDraw(null);await (fly||out());VS.fps=f0;
}
function vReset(){if(!VS.box)return;cancelAnimationFrame(VS.raf);VS.raf=0;VS.box.style.display='none';if(VS.ctx)vDraw(null);}
function framesTag(){var t='';['sframes','petframes','landframes','antframes','xfframes','aimframes','wkframes','aboutlogos'].forEach(function(id){var e=document.getElementById(id);if(e)t+='<script type="application/json" id="'+id+'">'+e.textContent+'<\/script>\n';});return t;}

/* ---------- editor (owner only) ---------- */
var art=null,assets=null,canEdit=false,dirty=false,saving=false,edView='list',edI=0,delArm=-1;
function slugify(t){var s=String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return s||'project';}
function uniqSlug(base,skip){var s=base,n=2;while(state.projects.some(function(p){return p!==skip&&p.slug===s;}))s=base+'-'+(n++);return s;}
function fab(){edroot.innerHTML=canEdit?'<button class="edit-fab'+(dirty?' dirty':'')+'" data-ed="open">Редактировать сайт</button>':'';}
function fld(label,f,val,area,ph){return '<label class="fld"><span>'+label+'</span>'+(area?'<textarea data-f="'+f+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>':'<input data-f="'+f+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>')+'</label>';}
function foot(){return '<div class="ed-foot"><span class="ed-status">'+(saving?'Сохраняю…':dirty?'Есть несохранённые изменения':'Всё сохранено')+'</span><span class="ed-row"><button class="b" data-ed="close">Закрыть</button><button class="b primary" data-ed="save"'+(!dirty||saving?' disabled':'')+'>Сохранить на сайте</button></span></div>';}
function edRender(){

    h='<div class="ed-head"><h2>Проекты</h2></div><ol class="ed-list">'+L.map(function(p,i){return '<li><span class="n">'+pad(i+1)+'</span><span class="t">'+esc(p.title||'Без названия')+'</span><span class="acts">'
      +'<button class="b" data-ed="up" data-i="'+i+'" aria-label="Выше"'+(i===0?' disabled':'')+'>↑</button><button class="b" data-ed="down" data-i="'+i+'" aria-label="Ниже"'+(i===L.length-1?' disabled':'')+'>↓</button>'
      +'<button class="b" data-ed="edit" data-i="'+i+'">Изменить</button><button class="b danger" data-ed="del" data-i="'+i+'">'+(delArm===i?'Точно удалить?':'Удалить')+'</button></span></li>';}).join('')+'</ol>'
      +'<div class="ed-row"><button class="b" data-ed="add">Добавить проект</button><button class="b" data-ed="profile">Профиль, About и контакты</button></div>'+foot();
  }else if(edView==='project'){
    var p=L[edI];
    h='<div class="ed-head"><h2>'+esc(p.title||'Новый проект')+'</h2><button class="b" data-ed="list">К списку</button></div>'
     +fld('Название','title',p.title)+'<div class="two">'+fld('Сфера (Industry), напр. Fintech','category',p.category,false,'Brand Identity')+fld('Период (Period), напр. 2025 — present','year',p.year,false,'2025')+'</div>'
     +fld('Роль','role',p.role,false,'Art Direction')+fld('Brief','brief',p.brief)+fld('Idea','idea',p.idea)+fld('Result','result',p.result)+fld('Раздел на Work: design (кейсы дизайнера), ad (кейсы арт-директора) или concept','kind',p.kind,false,'design')+fld('Короткое описание','desc',p.desc,true)
     +'<div class="fld"><span>Фото и видео (первое станет обложкой и главным изображением)</span></div><div class="mgrid">'
     +(p.media||[]).map(function(m,k){return '<div class="mi"><div class="th">'+(m.type==='video'?'<video src="'+esc(m.src)+'" muted preload="metadata"></video>':'<img src="'+esc(m.src)+'" alt="">')+'</div><div class="acts"><button class="b" data-ed="ml" data-k="'+k+'" aria-label="Раньше"'+(k===0?' disabled':'')+'>←</button><button class="b" data-ed="mr" data-k="'+k+'" aria-label="Позже"'+(k===p.media.length-1?' disabled':'')+'>→</button><button class="b danger" data-ed="mdel" data-k="'+k+'" aria-label="Убрать">×</button></div><input class="mi-g" data-mg="'+k+'" value="'+esc(m.group||'')+'" placeholder="Раздел, напр. Creatives" aria-label="Раздел для этого файла"><input class="mi-g" data-mf="title" data-mk="'+k+'" value="'+esc(m.title||'')+'" placeholder="Название поста" aria-label="Название поста"><input class="mi-g" data-mf="idea" data-mk="'+k+'" value="'+esc(m.idea||'')+'" placeholder="Идея" aria-label="Идея"><input class="mi-g" data-mf="placement" data-mk="'+k+'" value="'+esc(m.placement||'')+'" placeholder="Площадки, напр. Instagram · Telegram" aria-label="Площадки размещения"></div>';}).join('')+'</div><p class="hint">Раздел: если у файлов кейса разные разделы (Creatives, Полиграфия…), на странице кейса появится переключатель между ними, как Cases | Concepts на Work.</p>'
     +(assets?'<div class="ed-row"><span class="b upl">Добавить фото или видео<input type="file" accept="image/*,video/mp4,video/webm" multiple data-up></span></div>':'<p class="hint">Загрузка файлов сейчас недоступна.</p>')
     +'<p class="hint">Пока файлов нет, на сайте показываются аккуратные заглушки.</p>'+foot();
  }else{
    var P=state.profile;
    h='<div class="ed-head"><h2>Профиль, About и контакты</h2><button class="b" data-ed="list">К списку</button></div>'
     +'<div class="two">'+fld('Имя','name',P.name)+fld('Подпись','role',P.role)+'</div>'
     +fld('About: главное предложение','intro',P.intro,true)+fld('Специализация','specialization',P.specialization,true)+fld('Опыт','experience',P.experience,true)+fld('Подход к работе','approach',P.approach,true)
     +fld('Компетенции (по одной в строке)','capabilities',P.capabilities,true)+fld('About: приветствие','aboutHello',P.aboutHello)+fld('About: первая фраза','aboutLead',P.aboutLead,true)+fld('About: текст о себе (абзацы через пустую строку)','aboutText',P.aboutText,true)+fld('About: факты (по одному в строке)','aboutFacts',P.aboutFacts,true)+fld('About: опыт — «годы | компания | должность | описание», по одному в строке','career',P.career,true)+fld('About: hard skills (по одному в строке)','expertise',P.expertise,true)+fld('About: soft skills (по одному в строке)','softSkills',P.softSkills,true)+fld('About: заголовок блока клиентов','clientsTitle',P.clientsTitle)+fld('About: выставки и мероприятия (по одному в строке)','events',P.events,true)+fld('Тема главной: orbit, portal2, portal, dark или light','homeTheme',P.homeTheme||'portal',false,'portal')+fld('Work: короткое описание под заголовком','workIntro',P.workIntro||WINTRO,true)+fld('Contact: призыв к сотрудничеству','contactLine',P.contactLine)+fld('Надписи на экране персонажа (по одной в строке)','screen',P.screen,true,'Hi!')
     +'<div class="two">'+fld('Email','email',P.email)+fld('Telegram','telegram',P.telegram,false,'@username')+'</div>'

  }
  dlg.innerHTML='<div class="ed">'+h+'</div>';

function markDirty(){dirty=true;var st=$('.ed-status',dlg);if(st)st.textContent='Есть несохранённые изменения';var sv=$('[data-ed="save"]',dlg);if(sv)sv.disabled=saving;fab();}
dlg.addEventListener('input',function(e){if(e.target.dataset.mf&&edView==='project'){var m2=(state.projects[edI].media||[])[+e.target.dataset.mk];if(m2){m2[e.target.dataset.mf]=e.target.value;markDirty();}return;}if(e.target.dataset.mg!=null&&edView==='project'){var mm=(state.projects[edI].media||[])[+e.target.dataset.mg];if(mm){mm.group=e.target.value;markDirty();}return;}var f=e.target.dataset.f;if(!f)return;var o=edView==='project'?state.projects[edI]:state.profile;o[f]=e.target.value;markDirty();});
dlg.addEventListener('change',function(e){if(e.target.matches('[data-up]'))upload(e.target.files);});
dlg.addEventListener('close',function(){delArm=-1;state.projects.forEach(function(p){if(!p.slug)p.slug=uniqSlug(slugify(p.title),p);});var r=parse(cur?cur.hash:location.hash);cur=r;render(r);snap();fab();});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-ed]');if(!b)return;var a=b.dataset.ed,i=+b.dataset.i,k=+b.dataset.k,L=state.projects,t;
  if(a!=='del')delArm=-1;
  if(a==='open'){edView='list';edRender();dlg.showModal();return;}
  if(a==='close'){dlg.close();return;}
  if(a==='save'){save();return;}
  if(a==='list'){edView='list';}
  else if(a==='profile'){edView='profile';}
  else if(a==='edit'){edView='project';edI=i;}
  else if(a==='add'){L.push({slug:'',title:'New project',category:'',year:'',role:'',desc:'',tone:TONES[L.length%TONES.length],media:[]});L[L.length-1].slug=uniqSlug('new-project',L[L.length-1]);edView='project';edI=L.length-1;markDirty();}
  else if(a==='up'&&i>0){t=L[i-1];L[i-1]=L[i];L[i]=t;markDirty();}
  else if(a==='down'&&i<L.length-1){t=L[i+1];L[i+1]=L[i];L[i]=t;markDirty();}
  else if(a==='del'){if(delArm===i){L.splice(i,1);delArm=-1;wa=0;markDirty();}else delArm=i;}
  else if(a==='ml'||a==='mr'){var M=L[edI].media,j=a==='ml'?k-1:k+1;if(j>=0&&j<M.length){t=M[j];M[j]=M[k];M[k]=t;markDirty();}}
  else if(a==='mdel'){L[edI].media.splice(k,1);markDirty();}
  else return;
  edRender();
});
function measure(file){return new Promise(function(res){var fb=file.type.indexOf('video')===0?'16/9':'4/3',u;try{u=URL.createObjectURL(file);}catch(e){return res(fb);}
  var done=function(w,h){try{URL.revokeObjectURL(u);}catch(e){}res(w&&h?w+'/'+h:fb);};
  if(file.type.indexOf('video')===0){var v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=function(){done(v.videoWidth,v.videoHeight);};v.onerror=function(){done();};v.src=u;}
  else{var im=new Image();im.onload=function(){done(im.naturalWidth,im.naturalHeight);};im.onerror=function(){done();};im.src=u;}
  setTimeout(function(){done();},4000);});}
async function upload(files){
  if(!assets||!files||!files.length)return;var p=state.projects[edI];p.media=p.media||[];
  for(var n=0;n<files.length;n++){var f=files[n];
    if(f.size>20*1024*1024){toast('«'+f.name+'» больше 20 МБ. Сожмите файл и загрузите снова.');continue;}
    toast('Загружаю «'+f.name+'»…');
    try{var ratio=await measure(f);var r=await assets.upload(f);p.media.push({type:f.type.indexOf('video')===0?'video':'image',src:r.url,ratio:ratio});markDirty();edRender();}
    catch(err){toast('Не удалось загрузить «'+f.name+'»'+(err&&err.code?' ('+err.code+')':'')+'.');}
  }
  toast('Готово. Не забудьте сохранить на сайте.');
}
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head>\n'+HEAD+'<title>'+esc(state.profile.name+' — '+state.profile.role)+'</title>\n<style id="css">'+CSS+'</style>\n</head><body>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-js">'+JS+'<\/script>\n'+framesTag()+'</body></html>\n';
}
function save(){
  if(!art||saving)return;state.projects.forEach(function(p){if(!p.slug)p.slug=uniqSlug(slugify(p.title),p);});
  saving=true;var was=dirty;dirty=false;edRender();
  art.publish(buildDoc()).then(function(){toast('Сохранено. Сайт обновляется.');},function(err){
    var c=err&&err.code;
    if(c==='conflict')toast('Сайт изменили в другом окне. Загружаю свежую версию.');
    else if(c==='not_writer'||c==='not_granted'){canEdit=false;toast('У этого просмотра нет прав на изменение.');if(dlg.open)dlg.close();}
    else{dirty=was;toast('Не удалось сохранить'+(c?' ('+c+')':'')+'. Попробуйте ещё раз через минуту.');}
  }).then(function(){saving=false;if(dlg.open)edRender();fab();});
}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

/* ---------- boot ---------- */
i18nBoot();
sizeCanvas();
cur=parse(location.hash);render(cur);
requestAnimationFrame(function(){snap();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){snap();});
setTimeout(snap,400);
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact'),window.claude.use('user'),window.claude.use('assets')]).then(function(r){
    if(!r[0]||!r[1])return;assets=r[2];
    return Promise.all([r[1].canEdit(),r[1].isOwner()]).then(function(x){if(x[0]||x[1]){art=r[0];canEdit=true;fab();}});
  }).catch(function(){});
}
